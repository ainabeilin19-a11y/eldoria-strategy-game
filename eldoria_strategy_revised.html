<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>エルドリア戦略ゲーム Prototype 改訂版</title>
<style>
:root{--bg:#07131e;--panel:#111c28;--panel2:#182635;--text:#f3ead0;--muted:#aeb8c2;--line:#d7d0b6;--accent:#d9a441}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;background:#0b1824}
.top{padding:10px;display:flex;gap:8px;align-items:stretch}
.badge,.stats,.panel{background:linear-gradient(145deg,#182534,#0f1722);border:1px solid #596675;border-radius:14px}
.badge{width:145px;padding:10px;text-align:center}
.badge .lv{font-size:34px;font-weight:800;color:#e8b44d}
.badge .name{font-size:15px;font-weight:700}
.progress{height:8px;background:#263443;border-radius:99px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;width:64%;background:#3c8acb}
.stats{flex:1;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.stat b{display:block;font-size:18px;color:#fff}
.mapwrap{position:relative;padding:8px 8px 0}
svg{width:100%;height:auto;display:block;border:1px solid #526273;border-radius:14px;background:#08324a;touch-action:manipulation}
.territory{cursor:pointer;stroke:#fff;stroke-width:2}
.territory.selected{stroke:#ffe08a;stroke-width:4}
.road{stroke:#eee6cc;stroke-width:2.1;opacity:.72}
.label{font-size:9px;fill:#fff;paint-order:stroke;stroke:#101820;stroke-width:3px;pointer-events:none}
.legend{position:absolute;left:18px;top:18px;background:rgba(12,21,30,.92);border:1px solid #65717d;border-radius:10px;padding:8px;font-size:11px;z-index:2}
.legend div{display:flex;align-items:center;gap:5px;margin:4px 0}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.detail{margin:8px;padding:12px;background:#101c28;border:1px solid #556473;border-radius:14px}
.detail h2{margin:0 0 5px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.metric{background:#182735;border-radius:10px;padding:8px;text-align:center}
.metric b{display:block;font-size:19px}
.bottom{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:8px;position:sticky;bottom:0;background:#08131d;border-top:1px solid #344352;z-index:5}
button{font:inherit;color:var(--text);background:#152536;border:1px solid #47596a;border-radius:10px;padding:9px 3px;min-width:0}
button.active{background:#5b431e;border-color:#d6a743}
.small{font-size:11px;color:var(--muted)}
.map-note{padding:8px 12px;color:var(--muted);font-size:11px;text-align:center}
@media(max-width:480px){.badge{width:125px}.badge .lv{font-size:28px}.stats{font-size:12px}.label{font-size:8px}}
</style>
</head>
<body>
<div class="app">
<div class="top">
<div class="badge"><div class="lv">Lv.10</div><div class="name">中央王国</div><div class="progress"><i></i></div><div class="small">国家レベル → 部隊レベル +10</div></div>
<div class="stats">
<div class="stat">収入<b id="income">100</b></div>
<div class="stat">兵力<b id="force">100</b></div>
<div class="stat">領地<b id="lands">1 / 58</b></div>
<div class="stat">防衛補正<b>未設定</b></div>
</div>
</div>
<div class="mapwrap">
<div class="legend" id="legend"></div>
<svg viewBox="0 0 1000 1150" role="img" aria-label="エルドリア大陸の戦略マップ">
<defs>
<linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2e6b52"/><stop offset=".5" stop-color="#66844b"/><stop offset="1" stop-color="#a77c43"/></linearGradient>
</defs>
<path d="M115 80 Q500 15 885 85 Q970 300 900 520 Q975 780 875 1060 Q520 1135 120 1060 Q25 760 95 520 Q30 300 115 80Z" fill="url(#land)" stroke="#b7c2c9" stroke-width="5"/>
<!-- 地形の目安になる河川 -->
<path d="M135 410 Q300 300 455 390 T865 350 M120 680 Q300 585 480 675 T890 610 M185 885 Q420 770 610 850 T875 800"
fill="none" stroke="#4f91a4" stroke-width="9" opacity=".58"/>
<g id="roads"></g><g id="nodes"></g>
</svg>
<div class="map-note">58領地・5か国／中央王国を中心に、地域ごとの密度を均等化した改訂マップ</div>
</div>
<div class="detail" id="detail"><h2>領地を選択</h2><div class="small">マップ上の領地をタップすると詳細を表示します。</div></div>
<div class="bottom">
<button class="active" data-mode="map">🗺️<br>マップ</button>
<button data-mode="army">⚔️<br>部隊</button>
<button data-mode="domestic">🏛️<br>内政</button>
<button data-mode="land">🏰<br>領地</button>
<button data-mode="diplomacy">🤝<br>外交</button>
<button data-mode="other">⚙️<br>その他</button>
</div>
</div>
<script>
const territories=[{"id":1,"country":"central","type":"capital","name":"ロイヤルシティ","income":100,"force":100,"x":500,"y":560},{"id":2,"country":"aldia","type":"town","name":"グリーンフォード","income":55,"force":30,"x":365,"y":500},{"id":3,"country":"aldia","type":"farm","name":"ウィンドミル","income":70,"force":20,"x":270,"y":555},{"id":4,"country":"aldia","type":"fort","name":"西部要塞","income":20,"force":65,"x":245,"y":430},{"id":5,"country":"aldia","type":"fort","name":"フォートレス","income":15,"force":55,"x":180,"y":665},{"id":6,"country":"aldia","type":"town","name":"ウェストガード","income":45,"force":35,"x":170,"y":760},{"id":7,"country":"aldia","type":"town","name":"サンセットポート","income":65,"force":25,"x":95,"y":865},{"id":8,"country":"aldia","type":"forest","name":"西部森林領","income":15,"force":10,"x":220,"y":555},{"id":9,"country":"aldia","type":"mountain","name":"西山岳領","income":10,"force":15,"x":130,"y":700},{"id":10,"country":"aldia","type":"mountain","name":"鉄壁高地","income":10,"force":15,"x":285,"y":690},{"id":11,"country":"aldia","type":"plain","name":"グリーンヒル","income":20,"force":15,"x":330,"y":600},{"id":12,"country":"aldia","type":"farm","name":"ウェストリバー","income":60,"force":20,"x":395,"y":650},{"id":13,"country":"aldia","type":"farm","name":"南西農地","income":80,"force":15,"x":330,"y":790},{"id":14,"country":"aldia","type":"mine","name":"西方鉱山","income":50,"force":30,"x":270,"y":845},{"id":15,"country":"elfrid","type":"forest","name":"グレイウッドの森","income":20,"force":15,"x":330,"y":245},{"id":16,"country":"elfrid","type":"town","name":"アイスベイ","income":45,"force":25,"x":430,"y":190},{"id":17,"country":"elfrid","type":"fort","name":"フロスト砦","income":20,"force":60,"x":505,"y":105},{"id":18,"country":"elfrid","type":"fort","name":"北境の要塞","income":15,"force":50,"x":300,"y":145},{"id":19,"country":"elfrid","type":"town","name":"リーフォード","income":60,"force":30,"x":430,"y":375},{"id":20,"country":"elfrid","type":"forest","name":"北部森林領","income":15,"force":10,"x":300,"y":285},{"id":21,"country":"elfrid","type":"farm","name":"北部農地","income":65,"force":20,"x":555,"y":280},{"id":22,"country":"elfrid","type":"mountain","name":"白銀山地","income":10,"force":15,"x":400,"y":85},{"id":23,"country":"elfrid","type":"town","name":"森林湖畔","income":40,"force":25,"x":565,"y":190},{"id":24,"country":"elfrid","type":"farm","name":"ノースリバー","income":55,"force":15,"x":500,"y":340},{"id":25,"country":"elfrid","type":"plain","name":"北方丘陵","income":15,"force":10,"x":665,"y":150},{"id":26,"country":"elfrid","type":"forest","name":"フォレストヒル","income":20,"force":15,"x":660,"y":285},{"id":27,"country":"elfrid","type":"forest","name":"北東森林領","income":10,"force":10,"x":745,"y":235},{"id":28,"country":"arcadia","type":"town","name":"ホワイトヘブン","income":65,"force":35,"x":790,"y":320},{"id":29,"country":"arcadia","type":"farm","name":"ゴールデンフィールド","income":75,"force":15,"x":735,"y":400},{"id":30,"country":"arcadia","type":"forest","name":"イーストウッド","income":15,"force":10,"x":835,"y":470},{"id":31,"country":"arcadia","type":"town","name":"サンライト","income":55,"force":25,"x":720,"y":515},{"id":32,"country":"arcadia","type":"town","name":"ドラゴンゲート","income":50,"force":35,"x":820,"y":585},{"id":33,"country":"arcadia","type":"fort","name":"バーバータワー要塞","income":15,"force":55,"x":875,"y":395},{"id":34,"country":"arcadia","type":"fort","name":"ストーンウォール要塞","income":20,"force":60,"x":875,"y":700},{"id":35,"country":"arcadia","type":"mine","name":"東部鉱山","income":45,"force":30,"x":800,"y":650},{"id":36,"country":"arcadia","type":"town","name":"魔導研究都市","income":70,"force":30,"x":690,"y":620},{"id":37,"country":"arcadia","type":"forest","name":"東部森林領","income":10,"force":10,"x":750,"y":750},{"id":38,"country":"arcadia","type":"mine","name":"クリスタル鉱山","income":55,"force":35,"x":835,"y":805},{"id":39,"country":"arcadia","type":"farm","name":"東部農業地帯","income":60,"force":20,"x":700,"y":790},{"id":40,"country":"arcadia","type":"mountain","name":"魔導高地","income":10,"force":15,"x":875,"y":835},{"id":41,"country":"grandia","type":"town","name":"サンドシティ","income":50,"force":25,"x":380,"y":900},{"id":42,"country":"grandia","type":"town","name":"ダストホールド","income":40,"force":30,"x":500,"y":875},{"id":43,"country":"grandia","type":"town","name":"ブライトキャッスル","income":55,"force":25,"x":690,"y":900},{"id":44,"country":"grandia","type":"town","name":"サンライズポート","income":70,"force":30,"x":855,"y":940},{"id":45,"country":"grandia","type":"plain","name":"レッドデューン","income":15,"force":10,"x":470,"y":970},{"id":46,"country":"grandia","type":"mountain","name":"スカルロック","income":10,"force":15,"x":600,"y":1050},{"id":47,"country":"grandia","type":"farm","name":"南部農地","income":80,"force":25,"x":360,"y":1010},{"id":48,"country":"grandia","type":"plain","name":"南部平原","income":20,"force":15,"x":510,"y":1090},{"id":49,"country":"grandia","type":"farm","name":"南東農地","income":70,"force":20,"x":750,"y":1030},{"id":50,"country":"grandia","type":"plain","name":"南西平原","income":15,"force":10,"x":245,"y":1040},{"id":51,"country":"grandia","type":"mine","name":"南部鉱山","income":45,"force":30,"x":625,"y":940},{"id":52,"country":"grandia","type":"forest","name":"南部森林","income":10,"force":10,"x":300,"y":900},{"id":53,"country":"grandia","type":"plain","name":"グランディア平原","income":25,"force":15,"x":560,"y":1010},{"id":54,"country":"grandia","type":"fort","name":"南方要塞","income":20,"force":55,"x":610,"y":875},{"id":55,"country":"grandia","type":"farm","name":"東南農村","income":60,"force":20,"x":800,"y":1060},{"id":56,"country":"grandia","type":"farm","name":"西南農村","income":75,"force":25,"x":300,"y":980},{"id":57,"country":"grandia","type":"town","name":"南部港湾","income":60,"force":30,"x":900,"y":1030},{"id":58,"country":"grandia","type":"capital","name":"大帝国領","income":80,"force":70,"x":610,"y":920}];
const countries={"central":{"name":"中央王国","color":"#c94b4b","level":10,"capital":"ロイヤルシティ","style":"少数精鋭"},"aldia":{"name":"アルディア王国","color":"#4f79c7","level":5,"capital":"グリーンフォード","style":"歩兵主力"},"elfrid":{"name":"エルフリード王国","color":"#5e9b61","level":5,"capital":"リーフォード","style":"弓兵主力"},"arcadia":{"name":"アルカディア魔導国","color":"#8c62bd","level":5,"capital":"ホワイトヘブン","style":"魔法兵主力"},"grandia":{"name":"グランディア帝国","color":"#c89b3c","level":4,"capital":"サンドシティ","style":"低品質・大量"}};
const typeNames={"capital":"大都市","town":"街","mine":"鉱山","farm":"農村","fort":"要塞","plain":"平原","forest":"森林","mountain":"山岳"};
const roadPairs=[[1,2],[1,19],[1,24],[1,31],[1,42],[1,54],[2,3],[2,11],[2,12],[2,19],[3,4],[3,8],[3,11],[4,8],[5,6],[5,8],[5,9],[5,10],[6,7],[6,9],[6,14],[7,9],[10,11],[10,12],[10,13],[11,12],[12,42],[13,14],[13,41],[14,52],[15,18],[15,20],[16,17],[16,22],[17,22],[17,23],[18,20],[18,22],[19,21],[19,24],[21,23],[21,24],[21,26],[23,25],[24,29],[25,27],[26,27],[26,29],[27,28],[28,29],[28,33],[29,31],[30,32],[30,33],[31,36],[32,35],[34,35],[34,38],[34,40],[34,43],[35,36],[35,39],[37,38],[37,39],[38,39],[38,40],[38,43],[39,51],[40,44],[41,45],[41,47],[41,52],[42,45],[42,54],[43,51],[43,58],[44,49],[44,55],[44,57],[45,53],[46,48],[46,53],[47,50],[47,56],[48,53],[49,55],[50,56],[51,54],[51,58],[52,56],[53,58],[54,58],[55,57]];
const nodes=document.getElementById('nodes'),roadsG=document.getElementById('roads'),detail=document.getElementById('detail');
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]) )}
function labelSide(t){return t.x>700?"end":"start"}
function draw(){
 const byId=Object.fromEntries(territories.map(t=>[t.id,t]));
 roadPairs.forEach(([a,b])=>{
   const A=byId[a],B=byId[b];
   const line=document.createElementNS("http://www.w3.org/2000/svg","line");
   line.setAttribute("x1",A.x);line.setAttribute("y1",A.y);line.setAttribute("x2",B.x);line.setAttribute("y2",B.y);
   line.setAttribute("class","road");roadsG.appendChild(line);
 });
 territories.forEach(t=>{
   const g=document.createElementNS("http://www.w3.org/2000/svg","g");
   g.dataset.id=t.id;g.classList.add("territory");
   const c=countries[t.country];
   const r=t.type==="capital"?17:t.type==="fort"?14:t.type==="town"?12:10;
   const circle=document.createElementNS("http://www.w3.org/2000/svg","circle");
   circle.setAttribute("cx",t.x);circle.setAttribute("cy",t.y);circle.setAttribute("r",r);
   circle.setAttribute("fill",c.color);circle.setAttribute("class","territory");
   const title=document.createElementNS("http://www.w3.org/2000/svg","title");
   title.textContent=t.name+" / "+c.name;g.appendChild(circle);g.appendChild(title);
   const text=document.createElementNS("http://www.w3.org/2000/svg","text");
   const right=t.x>700;
   text.setAttribute("x",right?t.x-15:t.x+15);
   text.setAttribute("y",t.y+4);
   text.setAttribute("text-anchor",right?"end":"start");
   text.setAttribute("class","label");text.textContent=t.name;g.appendChild(text);
   g.addEventListener("click",()=>select(t.id));nodes.appendChild(g);
 });
}
function select(id){
 document.querySelectorAll(".territory").forEach(x=>x.classList.remove("selected"));
 const t=territories.find(x=>x.id===id),c=countries[t.country];
 document.querySelector(`[data-id="${id}"]`).classList.add("selected");
 detail.innerHTML=`<h2>${esc(t.name)} <span class="small">${esc(c.name)} / ${typeNames[t.type]}</span></h2>
 <div class="small">首都: ${esc(c.capital)}　国家Lv.${c.level}　部隊レベル加算 +${c.level}</div>
 <div class="grid"><div class="metric">収入<b>${t.income}</b></div><div class="metric">兵力<b>${t.force}</b></div><div class="metric">防衛補正<b>未設定</b></div></div>`;
}
function makeLegend(){
 document.getElementById("legend").innerHTML=Object.entries(countries).map(([k,c])=>`<div><span class="dot" style="background:${c.color}"></span>${c.name}</div>`).join("");
}
function updateHeader(){
 const central=territories.filter(t=>t.country==="central");
 document.getElementById("income").textContent=central.reduce((s,t)=>s+t.income,0);
 document.getElementById("force").textContent=central.reduce((s,t)=>s+t.force,0);
 document.getElementById("lands").textContent=central.length+" / 58";
}
document.querySelectorAll(".bottom button").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll(".bottom button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 if(b.dataset.mode==="map") detail.innerHTML=`<h2>領地を選択</h2><div class="small">マップ上の領地をタップすると詳細を表示します。</div>`;
 else detail.innerHTML=`<h2>${b.textContent.replace(/\n/g," ")}</h2><div class="small">この画面は次の開発段階で実装します。</div>`;
}));
draw();makeLegend();updateHeader();
</script>
</body>
</html>
