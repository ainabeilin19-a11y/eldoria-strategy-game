<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>エルドリア戦略ゲーム Prototype 完成版</title>
<style>
:root{--bg:#07131e;--panel:#111c28;--panel2:#182635;--text:#f3ead0;--muted:#aeb8c2;--line:#d7d0b6;--accent:#d9a441}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;background:#0b1824}
.top{padding:10px;display:flex;gap:8px;align-items:stretch}
.badge,.stats,.panel{background:linear-gradient(145deg,#182534,#0f1722);border:1px solid #596675;border-radius:14px}
.badge{width:145px;padding:10px;text-align:center}
.badge .lv{font-size:34px;font-weight:800;color:#e8b44d}
.badge .name{font-size:15px;font-weight:700}
.progress{height:8px;background:#263443;border-radius:99px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;width:64%;background:#3c8acb}
.stats{flex:1;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.stat b{display:block;font-size:18px;color:#fff}
.mapwrap{position:relative;padding:8px 8px 0}
svg{width:100%;height:auto;display:block;border:1px solid #526273;border-radius:14px;background:#06334a;touch-action:manipulation}
.territory{cursor:pointer;stroke:#fff;stroke-width:2.2;stroke-linejoin:round;transition:filter .12s,stroke-width .12s}
.territory:hover{filter:brightness(1.12)}
.territory.selected{stroke:#ffe08a;stroke-width:4;filter:brightness(1.12)}
.road{stroke:#eee6cc;stroke-width:2.2;opacity:.65}
.border{fill:none;stroke:#b7c2c9;stroke-width:5}
.label{font-size:9px;fill:#fff;paint-order:stroke;stroke:#101820;stroke-width:3px;pointer-events:none}
.icon{font-size:22px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.territory-name{font-size:10px;fill:#fff;paint-order:stroke;stroke:#101820;stroke-width:3px;pointer-events:none}
.legend{position:absolute;left:18px;top:18px;background:rgba(12,21,30,.94);border:1px solid #65717d;border-radius:10px;padding:8px;font-size:11px;z-index:2}
.legend div{display:flex;align-items:center;gap:5px;margin:4px 0}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.map-note{padding:8px 12px;color:var(--muted);font-size:11px;text-align:center}
.detail{margin:8px;padding:12px;background:#101c28;border:1px solid #556473;border-radius:14px}
.detail h2{margin:0 0 5px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.metric{background:#182735;border-radius:10px;padding:8px;text-align:center}
.metric b{display:block;font-size:19px}
.bottom{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:8px;position:sticky;bottom:0;background:#08131d;border-top:1px solid #344352;z-index:5}
button{font:inherit;color:var(--text);background:#152536;border:1px solid #47596a;border-radius:10px;padding:9px 3px;min-width:0}
button.active{background:#5b431e;border-color:#d6a743}
.small{font-size:11px;color:var(--muted)}
@media(max-width:480px){.badge{width:125px}.badge .lv{font-size:28px}.stats{font-size:12px}.label,.territory-name{font-size:8px}}
</style>
</head>

function drawTerritories(){
  territories.forEach(t=>{
    const g=document.createElementNS(svgNS,"g");
    g.dataset.id=t.id;
    const c=countries[t.country];
    const poly=document.createElementNS(svgNS,"polygon");
    poly.setAttribute("points",polygons[t.id]);
    poly.setAttribute("fill",c.color);
    poly.setAttribute("fill-opacity",t.country==="central" ? ".92" : ".78");
    poly.setAttribute("class","territory");
    g.appendChild(poly);

    const icon=document.createElementNS(svgNS,"text");
    icon.setAttribute("x",t.x);icon.setAttribute("y",t.y-2);
    icon.setAttribute("class","icon");
    icon.textContent=icons[t.type] || "◆";
    g.appendChild(icon);

    const text=document.createElementNS(svgNS,"text");
    const right=t.x>700;
    text.setAttribute("x",right?t.x-45:t.x+45);
    text.setAttribute("y",t.y+4);
    text.setAttribute("text-anchor",right?"end":"start");
    text.setAttribute("class","territory-name");
    text.textContent=t.name;
    g.appendChild(text);

    const title=document.createElementNS(svgNS,"title");
    title.textContent=t.name+" / "+c.name;
    g.appendChild(title);
    g.addEventListener("click",()=>select(t.id));
    nodes.appendChild(g);
  });
}

function select(id){
  document.querySelectorAll(".territory").forEach(x=>x.classList.remove("selected"));
  const g=document.querySelector(`[data-id="${id}"]`);
  if(g) g.querySelector(".territory").classList.add("selected");
  const t=territories.find(x=>x.id===id),c=countries[t.country];
  detail.innerHTML=`<h2>${esc(t.name)} <span class="small">${esc(c.name)} / ${typeNames[t.type]}</span></h2>
  <div class="small">首都: ${esc(c.capital)}　国家Lv.${c.level}　部隊レベル加算 +${c.level}</div>
  <div class="grid"><div class="metric">収入<b>${t.income}</b></div><div class="metric">兵力<b>${t.force}</b></div><div class="metric">防衛補正<b>未設定</b></div></div>`;
}

function makeLegend(){
 document.getElementById("legend").innerHTML =
 Object.entries(countries).map(([k,c])=>`<div><span class="dot" style="background:${c.color}"></span>${c.name} (${territories.filter(t=>t.country===k).length})</div>`).join("");
}
function updateHeader(){
 const central=territories.filter(t=>t.country==="central");
 document.getElementById("income").textContent=central.reduce((s,t)=>s+t.income,0);
 document.getElementById("force").textContent=central.reduce((s,t)=>s+t.force,0);
 document.getElementById("lands").textContent=central.length+" / 58";
}
document.querySelectorAll(".bottom button").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll(".bottom button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 if(b.dataset.mode==="map") detail.innerHTML=`<h2>領地を選択</h2><div class="small">マップ上の領地をタップすると詳細を表示します。</div>`;
 else detail.innerHTML=`<h2>${b.textContent.replace(/\n/g," ")}</h2><div class="small">この画面は次の開発段階で実装します。</div>`;
}));
drawRoads();drawTerritories();makeLegend();updateHeader();
