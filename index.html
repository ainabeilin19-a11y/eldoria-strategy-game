<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>エルドリア戦略ゲーム Prototype 最終マップ</title>
<style>
:root{--bg:#06131e;--panel:#0d1a27;--panel2:#142433;--text:#f5ecd5;--muted:#aeb9c3;--gold:#d9a441;--line:#d7d0b6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;background:#071521}
.top{padding:10px;display:grid;grid-template-columns:230px 1fr 185px;gap:8px;align-items:stretch}
.card{background:linear-gradient(145deg,#172534,#0d1722);border:1px solid #526272;border-radius:14px;box-shadow:0 3px 12px #0007}
.badge{padding:10px;text-align:center}
.lv{font-size:34px;font-weight:900;color:#e7b54f;line-height:1}
.badge .name{font-size:16px;font-weight:800;margin-top:6px}
.progress{height:8px;background:#263443;border-radius:99px;overflow:hidden;margin:10px 4px 7px}
.progress i{display:block;height:100%;width:64%;background:#3c8acb}
.small{font-size:11px;color:var(--muted)}
.stats{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{font-size:13px}
.stat b{display:block;font-size:19px;color:#fff;margin-top:2px}
.year{padding:10px;text-align:center}
.year .big{font-size:19px;color:#e7b54f;font-weight:800;margin-top:5px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
.quick button{font-size:11px;padding:8px 2px}
.mapwrap{position:relative;padding:8px 8px 0}
svg{width:100%;height:auto;display:block;border:1px solid #536578;border-radius:14px;background:#06334a;touch-action:manipulation}
.land-border{fill:url(#land);stroke:#c7d0d3;stroke-width:5}
.terrain{opacity:.38}
.river{fill:none;stroke:#438fa5;stroke-width:10;opacity:.72}
.road{stroke:#f0e8d1;stroke-width:2.2;opacity:.72;pointer-events:none}
.territory{cursor:pointer;stroke:#fff;stroke-width:2.1;stroke-linejoin:round;transition:filter .12s,stroke-width .12s}
.territory:hover{filter:brightness(1.15)}
.territory.selected{stroke:#ffe08a;stroke-width:4;filter:brightness(1.13)}
.icon{font-size:20px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.territory-name{font-size:10px;fill:#fff;paint-order:stroke;stroke:#101820;stroke-width:3px;pointer-events:none;font-weight:700}
.legend{position:absolute;left:18px;top:18px;background:rgba(7,17,27,.94);border:1px solid #65717d;border-radius:10px;padding:9px;font-size:12px;z-index:2}
.legend div{display:flex;align-items:center;gap:6px;margin:5px 0}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block;flex:0 0 auto}
.map-note{padding:8px 12px;color:var(--muted);font-size:11px;text-align:center}
.detail{margin:8px;padding:10px;background:#0d1a27;border:1px solid #556473;border-radius:14px}
.detail-main{display:grid;grid-template-columns:230px 1fr;gap:12px;align-items:center}
.territory-art{height:155px;border-radius:10px;overflow:hidden;border:1px solid #687889;background:#193244;box-shadow:inset 0 0 20px #0008}
.territory-art svg{border:0;border-radius:0;height:100%;width:100%;background:none}
.detail h2{margin:0 0 5px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.metric{background:#172838;border-radius:10px;padding:8px;text-align:center}
.metric b{display:block;font-size:19px}
.detail-actions{display:flex;justify-content:flex-end;margin-top:9px}
.detail-actions button{min-width:90px}
.bottom{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:8px;position:sticky;bottom:0;background:#07131eeb;border-top:1px solid #344352;z-index:5;backdrop-filter:blur(8px)}
button{font:inherit;color:var(--text);background:#142536;border:1px solid #47596a;border-radius:10px;padding:9px 3px;min-width:0}
button.active{background:#5b431e;border-color:#d6a743}
@media(max-width:700px){.top{grid-template-columns:145px 1fr}.year{display:none}.detail-main{grid-template-columns:170px 1fr}.territory-art{height:130px}}
@media(max-width:480px){.badge{width:auto}.badge .lv{font-size:28px}.stats{font-size:12px}.territory-name{font-size:8px}.icon{font-size:17px}.detail-main{grid-template-columns:1fr}.territory-art{height:180px}.legend{font-size:10px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="card badge">
      <div class="lv">Lv.10</div><div class="name">中央王国</div>
      <div class="progress"><i></i></div>
      <div class="small">国家レベル → 部隊レベル +10</div>
    </div>
    <div class="card stats">
      <div class="stat">収入<b id="income">100</b></div>
      <div class="stat">兵力<b id="force">100</b></div>
      <div class="stat">領地<b id="lands">1 / 58</b></div>
      <div class="stat">防衛補正<b>未設定</b></div>
    </div>
    <div class="card year">
      <div>⌛ 残り30年</div>
      <div class="quick">
        <button>⚔️<br>戦況</button><button>📜<br>記録</button><button>⚙️<br>設定</button>
      </div>
    </div>
  </div>

  <div class="mapwrap">
    <div class="legend" id="legend"></div>
    <svg viewBox="0 0 1000 1150" role="img" aria-label="エルドリア大陸の戦略マップ">
      <defs>
        <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="#2d624d"/><stop offset=".48" stop-color="#5d7d4b"/><stop offset="1" stop-color="#9b743c"/>
        </linearGradient>
        <clipPath id="landClip">
          <path d="M115 80 Q500 15 885 85 Q970 300 900 520 Q975 780 900 1090 Q520 1140 100 1080 Q25 780 95 520 Q30 300 115 80Z"/>
        </clipPath>
      </defs>
      <path d="M115 80 Q500 15 885 85 Q970 300 900 520 Q975 780 900 1090 Q520 1140 100 1080 Q25 780 95 520 Q30 300 115 80Z" class="land-border"/>
      <g clip-path="url(#landClip)" class="terrain">
        <path d="M80 350 Q280 220 470 360 T920 300" class="river"/>
        <path d="M60 650 Q300 520 500 680 T930 590" class="river"/>
        <path d="M120 900 Q360 760 610 870 T930 800" class="river"/>
        <path d="M150 180 Q250 100 370 190 M600 160 Q760 90 890 220" fill="none" stroke="#315d3d" stroke-width="100"/>
        <path d="M140 1000 Q350 900 560 1030 T900 960" fill="none" stroke="#8c6736" stroke-width="90"/>
      </g>
      <g id="roads"></g>
      <g id="territories"></g>
    </svg>
    <div class="map-note">58領地・5か国／中央1・アルディア13・エルフリード13・アルカディア13・グランディア18。領地は非重複配置。</div>
  </div>

  <div class="detail" id="detail">
    <div class="detail-main">
      <div class="territory-art" id="art"></div>
      <div><h2>ロイヤルシティ <span class="small">中央王国 / 大都市</span></h2>
      <div class="small">首都: ロイヤルシティ　国家Lv.10　部隊レベル加算 +10</div>
      <div class="grid"><div class="metric">収入<b>100</b></div><div class="metric">兵力<b>100</b></div><div class="metric">防衛補正<b>未設定</b></div></div>
      <div class="detail-actions"><button id="detailBtn">詳細</button></div></div>
    </div>
  </div>

  <div class="bottom">
    <button class="active" data-mode="map">🗺️<br>マップ</button>
    <button data-mode="army">⚔️<br>部隊</button>
    <button data-mode="domestic">🏛️<br>内政</button>
    <button data-mode="land">🏰<br>領地</button>
    <button data-mode="diplomacy">🤝<br>外交</button>
    <button data-mode="other">⚙️<br>その他</button>
  </div>
</div>

<script>
const territories=[{"id":1,"country":"central","type":"capital","name":"ロイヤルシティ","income":100,"force":100,"x":500,"y":590},{"id":2,"country":"aldia","type":"town","name":"グリーンフォード","income":55,"force":30,"x":140,"y":430},{"id":3,"country":"aldia","type":"farm","name":"ウィンドミル","income":70,"force":20,"x":270,"y":430},{"id":4,"country":"aldia","type":"fort","name":"西部要塞","income":20,"force":65,"x":400,"y":430},{"id":5,"country":"aldia","type":"fort","name":"フォートレス","income":15,"force":55,"x":120,"y":520},{"id":6,"country":"aldia","type":"town","name":"ウェストガード","income":45,"force":35,"x":250,"y":520},{"id":7,"country":"aldia","type":"town","name":"サンセットポート","income":65,"force":25,"x":380,"y":520},{"id":8,"country":"aldia","type":"forest","name":"西部森林領","income":15,"force":10,"x":150,"y":610},{"id":9,"country":"aldia","type":"mountain","name":"西山岳領","income":10,"force":15,"x":280,"y":610},{"id":10,"country":"aldia","type":"mountain","name":"鉄壁高地","income":10,"force":15,"x":410,"y":610},{"id":11,"country":"aldia","type":"plain","name":"グリーンヒル","income":20,"force":15,"x":120,"y":700},{"id":12,"country":"aldia","type":"farm","name":"ウェストリバー","income":60,"force":20,"x":260,"y":700},{"id":13,"country":"aldia","type":"farm","name":"南西農地","income":80,"force":15,"x":400,"y":700},{"id":14,"country":"aldia","type":"mine","name":"西方鉱山","income":50,"force":30,"x":170,"y":790},{"id":15,"country":"elfrid","type":"town","name":"リーフォード","income":60,"force":30,"x":200,"y":140},{"id":16,"country":"elfrid","type":"town","name":"アイスベイ","income":45,"force":25,"x":330,"y":140},{"id":17,"country":"elfrid","type":"fort","name":"フロスト砦","income":20,"force":60,"x":460,"y":140},{"id":18,"country":"elfrid","type":"fort","name":"北境の要塞","income":15,"force":50,"x":590,"y":140},{"id":19,"country":"elfrid","type":"forest","name":"北部森林領","income":15,"force":10,"x":720,"y":140},{"id":20,"country":"elfrid","type":"farm","name":"北部農地","income":65,"force":20,"x":850,"y":140},{"id":21,"country":"elfrid","type":"mountain","name":"白銀山地","income":10,"force":15,"x":260,"y":230},{"id":22,"country":"elfrid","type":"town","name":"森林湖畔","income":40,"force":25,"x":400,"y":230},{"id":23,"country":"elfrid","type":"farm","name":"ノースリバー","income":55,"force":15,"x":540,"y":230},{"id":24,"country":"elfrid","type":"plain","name":"北方丘陵","income":15,"force":10,"x":680,"y":230},{"id":25,"country":"elfrid","type":"forest","name":"フォレストヒル","income":20,"force":15,"x":820,"y":230},{"id":26,"country":"elfrid","type":"forest","name":"北東森林領","income":10,"force":10,"x":330,"y":320},{"id":27,"country":"elfrid","type":"farm","name":"ゴールデンフィールド","income":75,"force":15,"x":480,"y":320},{"id":28,"country":"arcadia","type":"town","name":"ホワイトヘブン","income":65,"force":35,"x":600,"y":430},{"id":29,"country":"arcadia","type":"town","name":"サンライト","income":55,"force":25,"x":730,"y":430},{"id":30,"country":"arcadia","type":"town","name":"ドラゴンゲート","income":50,"force":35,"x":860,"y":430},{"id":31,"country":"arcadia","type":"fort","name":"バーバータワー要塞","income":15,"force":55,"x":620,"y":520},{"id":32,"country":"arcadia","type":"fort","name":"ストーンウォール要塞","income":20,"force":60,"x":750,"y":520},{"id":33,"country":"arcadia","type":"forest","name":"イーストウッド","income":15,"force":10,"x":880,"y":520},{"id":34,"country":"arcadia","type":"town","name":"魔導研究都市","income":70,"force":30,"x":600,"y":610},{"id":35,"country":"arcadia","type":"forest","name":"東部森林領","income":10,"force":10,"x":730,"y":610},{"id":36,"country":"arcadia","type":"mine","name":"クリスタル鉱山","income":55,"force":35,"x":860,"y":610},{"id":37,"country":"arcadia","type":"farm","name":"東部農業地帯","income":60,"force":20,"x":620,"y":700},{"id":38,"country":"arcadia","type":"mountain","name":"魔導高地","income":10,"force":15,"x":760,"y":700},{"id":39,"country":"arcadia","type":"mine","name":"東部鉱山","income":45,"force":30,"x":890,"y":700},{"id":40,"country":"arcadia","type":"forest","name":"グレイウッドの森","income":20,"force":15,"x":700,"y":750},{"id":41,"country":"grandia","type":"town","name":"サンドシティ","income":50,"force":25,"x":100,"y":880},{"id":42,"country":"grandia","type":"town","name":"ダストホールド","income":40,"force":30,"x":230,"y":880},{"id":43,"country":"grandia","type":"town","name":"ブライトキャッスル","income":55,"force":25,"x":360,"y":880},{"id":44,"country":"grandia","type":"town","name":"サンライズポート","income":70,"force":30,"x":490,"y":880},{"id":45,"country":"grandia","type":"plain","name":"レッドデューン","income":15,"force":10,"x":620,"y":880},{"id":46,"country":"grandia","type":"town","name":"スカルロック","income":10,"force":15,"x":750,"y":880},{"id":47,"country":"grandia","type":"farm","name":"南部農地","income":80,"force":25,"x":140,"y":970},{"id":48,"country":"grandia","type":"plain","name":"南部平原","income":20,"force":15,"x":270,"y":970},{"id":49,"country":"grandia","type":"farm","name":"南東農地","income":70,"force":20,"x":400,"y":970},{"id":50,"country":"grandia","type":"plain","name":"南西平原","income":15,"force":10,"x":530,"y":970},{"id":51,"country":"grandia","type":"town","name":"南部鉱山","income":45,"force":30,"x":660,"y":970},{"id":52,"country":"grandia","type":"forest","name":"南部森林","income":10,"force":10,"x":790,"y":970},{"id":53,"country":"grandia","type":"plain","name":"グランディア平原","income":25,"force":15,"x":900,"y":970},{"id":54,"country":"grandia","type":"town","name":"南方要塞","income":20,"force":55,"x":200,"y":1050},{"id":55,"country":"grandia","type":"farm","name":"東南農村","income":60,"force":20,"x":350,"y":1050},{"id":56,"country":"grandia","type":"farm","name":"西南農村","income":75,"force":25,"x":500,"y":1050},{"id":57,"country":"grandia","type":"town","name":"南部港湾","income":60,"force":30,"x":650,"y":1050},{"id":58,"country":"grandia","type":"town","name":"大帝国領","income":80,"force":70,"x":800,"y":1050}];
const countries={"central":{"name":"中央王国","color":"#b84a45","level":10,"capital":"ロイヤルシティ","style":"少数精鋭"},"aldia":{"name":"アルディア王国","color":"#3979c8","level":5,"capital":"グリーンフォード","style":"歩兵主力"},"elfrid":{"name":"エルフリード王国","color":"#55a064","level":5,"capital":"リーフォード","style":"弓兵主力"},"arcadia":{"name":"アルカディア魔導国","color":"#8554b8","level":5,"capital":"ホワイトヘブン","style":"魔法兵主力"},"grandia":{"name":"グランディア帝国","color":"#c28c27","level":4,"capital":"サンドシティ","style":"低品質・大量"}};
const typeNames={capital:"大都市",town:"街",mine:"鉱山",farm:"農村",fort:"要塞",plain:"平原",forest:"森林",mountain:"山岳"};
const icons={capital:"🏰",town:"🏛",mine:"⛏",farm:"🌾",fort:"🛡",plain:"◆",forest:"🌲",mountain:"▲"};
const svgNS="http://www.w3.org/2000/svg";
const nodes=document.getElementById("territories"),roadsG=document.getElementById("roads"),detail=document.getElementById("detail"),art=document.getElementById("art");

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function byId(){return Object.fromEntries(territories.map(t=>[t.id,t]))}

function hexPoints(cx,cy,r=36) {
  const pts=[];
  for(let i=0;i<6;i++) {
    const a=(Math.PI/3)*i+Math.PI/6;
    pts.push(`${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`);
  }
  return pts.join(" ");
}

// 領地の接続は国ごとの近接領地を自動で結び、国境と中央王国にも主要道路を追加。
// これにより、旧版の格子状・極端な接続を避ける。
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function addRoadPair(set,a,b){if(a===b)return;const k=a<b?`${a}-${b}`:`${b}-${a}`;set.add(k)}
function buildRoads(){
  const set=new Set(), map=byId();
  for(const country of Object.keys(countries)){
    const ts=territories.filter(t=>t.country===country);
    if(ts.length<2) continue;
    const used=new Set([ts[0].id]);
    while(used.size<ts.length){
      let best=null;
      for(const a of ts.filter(t=>used.has(t.id))) for(const b of ts.filter(t=>!used.has(t.id))){
        const d=dist(a,b); if(!best || d<best.d) best={a,b,d};
      }
      addRoadPair(set,best.a.id,best.b.id); used.add(best.b.id);
    }
    for(const a of ts){
      const near=ts.filter(b=>b.id!==a.id).sort((u,v)=>dist(a,u)-dist(a,v)).slice(0,1)[0];
      if(near && dist(a,near)<155) addRoadPair(set,a.id,near.id);
    }
  }
  // 国境の主要道路
  const borders=[
    [1,39],[1,47],[1,16],[1,30],
    [5,19],[3,30],[13,41],[27,28],
    [37,49],[40,45],[52,54],[53,58]
  ];
  borders.forEach(([a,b])=>addRoadPair(set,a,b));
  for(const key of set){
    const [a,b]=key.split("-").map(Number),A=map[a],B=map[b];
    const line=document.createElementNS(svgNS,"line");
    line.setAttribute("x1",A.x);line.setAttribute("y1",A.y);
    line.setAttribute("x2",B.x);line.setAttribute("y2",B.y);
    line.setAttribute("class","road");
    roadsG.appendChild(line);
  }
}

function artSvg(t){
  const c=countries[t.country];
  const bg={plain:"#7b6a3c",forest:"#315f42",farm:"#7b7138",mountain:"#52616b",mine:"#3f4549",fort:"#354454",town:"#4b5c69",capital:"#6e4b2f"}[t.type]||"#3d5660";
  let scene="";
  if(t.type==="forest") scene=`<rect width="300" height="180" fill="${bg}"/><path d="M0 135 Q75 90 150 135 T300 125V180H0Z" fill="#294c37"/><g fill="#173d2a"><path d="M45 125l22-55 22 55zM105 125l25-65 25 65zM180 125l23-60 23 60zM235 125l20-52 20 52z"/></g>`;
  else if(t.type==="mountain") scene=`<rect width="300" height="180" fill="#4b5c65"/><path d="M0 145L65 55l50 60 55-80 80 110 50-55v90H0Z" fill="#2d3941"/><path d="M65 55l-18 28h36zM170 35l-24 36h48z" fill="#d9e2e0"/>`;
  else if(t.type==="farm") scene=`<rect width="300" height="180" fill="#7d743a"/><path d="M0 125Q70 80 145 125T300 115V180H0Z" fill="#5c6f37"/><g stroke="#d6c25d" stroke-width="5"><path d="M25 150L95 110M70 170l80-55M150 170l70-45M210 170l65-45"/></g>`;
  else if(t.type==="mine") scene=`<rect width="300" height="180" fill="#3f474b"/><path d="M0 145L70 85l55 40 60-75 115 95v35H0Z" fill="#30383c"/><path d="M105 150v-55l45-30 45 30v55" fill="#1c2327"/><path d="M115 112h70" stroke="#d0a13e" stroke-width="8"/>`;
  else if(t.type==="fort") scene=`<rect width="300" height="180" fill="#334353"/><rect x="55" y="75" width="190" height="70" fill="#70777c"/><path d="M45 75h210M70 50h35v25h-35zM195 50h35v25h-35z" fill="#8b9295"/><path d="M135 105h30v40h-30z" fill="#303b44"/>`;
  else if(t.type==="capital") scene=`<rect width="300" height="180" fill="#6f5137"/><path d="M0 140Q70 85 150 130T300 120V180H0Z" fill="#416342"/><rect x="75" y="70" width="150" height="75" fill="#ded7c5"/><path d="M55 75l45-50 45 50zM145 75l45-50 45 50z" fill="#9b3f36"/><rect x="132" y="105" width="36" height="40" fill="#805c3c"/>`;
  else scene=`<rect width="300" height="180" fill="${bg}"/><path d="M0 140Q80 80 150 130T300 120V180H0Z" fill="#31563d"/><rect x="95" y="70" width="110" height="75" fill="#d9d3c4"/><path d="M85 75l65-55 65 55z" fill="#9b443b"/><rect x="140" y="105" width="22" height="40" fill="#76523a"/>`;
  return `<svg viewBox="0 0 300 180" aria-label="${esc(t.name)}の景観">${scene}<text x="150" y="22" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" paint-order="stroke" stroke="#101820" stroke-width="3">${esc(t.name)}</text></svg>`;
}

function drawTerritories(){
  territories.forEach(t=>{
    const g=document.createElementNS(svgNS,"g"); g.dataset.id=t.id;
    const c=countries[t.country];
    const poly=document.createElementNS(svgNS,"polygon");
    poly.setAttribute("points",hexPoints(t.x,t.y,36));
    poly.setAttribute("fill",c.color);
    poly.setAttribute("fill-opacity",t.country==="central" ? ".94" : ".82");
    poly.setAttribute("class","territory");
    g.appendChild(poly);

    const icon=document.createElementNS(svgNS,"text");
    icon.setAttribute("x",t.x);icon.setAttribute("y",t.y-3);icon.setAttribute("class","icon");
    icon.textContent=icons[t.type]||"◆";g.appendChild(icon);

    const text=document.createElementNS(svgNS,"text");
    const right=t.x>720;
    text.setAttribute("x",right?t.x-42:t.x+42);
    text.setAttribute("y",t.y+4);
    text.setAttribute("text-anchor",right?"end":"start");
    text.setAttribute("class","territory-name");
    text.textContent=t.name;g.appendChild(text);

    const title=document.createElementNS(svgNS,"title");
    title.textContent=t.name+" / "+c.name;g.appendChild(title);
    g.addEventListener("click",()=>select(t.id));
    nodes.appendChild(g);
  });
}

function select(id){
  document.querySelectorAll(".territory").forEach(x=>x.classList.remove("selected"));
  const g=document.querySelector(`[data-id="${id}"]`);
  if(g) g.querySelector(".territory").classList.add("selected");
  const t=territories.find(x=>x.id===id),c=countries[t.country];
  art.innerHTML=artSvg(t);
  detail.innerHTML=`<div class="detail-main"><div class="territory-art" id="art">${artSvg(t)}</div>
  <div><h2>${esc(t.name)} <span class="small">${esc(c.name)} / ${typeNames[t.type]}</span></h2>
  <div class="small">首都: ${esc(c.capital)}　国家Lv.${c.level}　部隊レベル加算 +${c.level}</div>
  <div class="grid"><div class="metric">収入<b>${t.income}</b></div><div class="metric">兵力<b>${t.force}</b></div><div class="metric">防衛補正<b>未設定</b></div></div>
  <div class="detail-actions"><button id="detailBtn">詳細</button></div></div></div>`;
}

function makeLegend(){
  document.getElementById("legend").innerHTML=Object.entries(countries).map(([k,c])=>
    `<div><span class="dot" style="background:${c.color}"></span>${c.name} (${territories.filter(t=>t.country===k).length})</div>`).join("");
}
function updateHeader(){
  const central=territories.filter(t=>t.country==="central");
  document.getElementById("income").textContent=central.reduce((s,t)=>s+t.income,0);
  document.getElementById("force").textContent=central.reduce((s,t)=>s+t.force,0);
  document.getElementById("lands").textContent=central.length+" / 58";
}
document.querySelectorAll(".bottom button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".bottom button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  if(b.dataset.mode==="map") select(1);
  else detail.innerHTML=`<div class="detail-main"><div class="territory-art"><svg viewBox="0 0 300 180"><rect width="300" height="180" fill="#172838"/><text x="150" y="95" text-anchor="middle" fill="#e8b44d" font-size="22">${b.textContent.replace(/\n/g," ")}</text></svg></div><div><h2>${b.textContent.replace(/\n/g," ")}</h2><div class="small">この画面は次の開発段階で実装します。</div></div></div>`;
}));

buildRoads();drawTerritories();makeLegend();updateHeader();select(1);
</script>
</body>
</html>
