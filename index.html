<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eldoria Strategy</title><style>
*{box-sizing:border-box}body{margin:0;background:#07131d;color:#eee;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.top{height:58px;background:#0b1b28;border-bottom:1px solid #5b6f7d;display:flex;justify-content:space-between;align-items:center;padding:8px 12px}.title{font-weight:900}.tabs button,.btn{background:#243b4a;color:#fff;border:1px solid #70828e;border-radius:7px;padding:8px 12px;font-weight:800}.tabs button.active,.attack{background:#873737;border-color:#d36b6b}.screen{display:none;height:calc(100vh - 58px)}.screen.active{display:flex}#admin{padding:14px;overflow:auto;justify-content:center}.cards{width:min(900px,100%);display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:linear-gradient(145deg,#0d1d2b,#122638);border:1px solid #5e7485;border-radius:12px;padding:15px}.card h2{margin:0 0 6px;color:#f0d27b;font-size:17px}.card p{font-size:12px;color:#cbd5db;line-height:1.6}.card button{margin-top:8px}.map{position:relative;flex:1;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#6c7d55,#405a45 42%,#263d36 72%,#152c35)}.map:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 15% 20%,#a7ad7020 0 12%,transparent 13%),radial-gradient(ellipse at 76% 65%,#c3b07818 0 15%,transparent 16%)}.maptitle{position:absolute;top:10px;left:10px;z-index:30;background:#071725dd;border:1px solid #71828c;border-radius:8px;padding:7px 10px}.road{position:absolute;height:5px;background:#cdbd91cc;border-radius:5px;transform-origin:left center;z-index:2}.territory{position:absolute;width:76px;height:76px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #eee;z-index:10;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:900;cursor:pointer;box-shadow:0 5px 12px #0009}.territory.central{background:#92732d}.aldia{background:#994646}.elf{background:#397e55}.arc{background:#684c99}.gran{background:#3f6795}.panel{position:absolute;right:10px;top:10px;width:min(310px,calc(100% - 20px));background:#091a27ee;border:1px solid #6b7d88;border-radius:12px;padding:14px;z-index:40;display:none}.panel.show{display:block}.panel h2{margin:0 0 8px}.panel p{font-size:12px;line-height:1.6}.actions{display:flex;gap:7px}.actions button{flex:1}.battle{position:relative;flex:1;overflow:hidden;background:radial-gradient(circle at 50% 45%,#536a4c,#2c493d 55%,#152f35)}.lane{position:absolute;left:13%;right:13%;height:25%;border:1px solid #ffffff55;clip-path:polygon(3% 8%,97% 0,100% 84%,2% 100%);transform:skewX(-4deg)}.lane span{position:absolute;left:8px;top:7px;background:#071725cc;padding:3px 6px;border-radius:5px;font-size:11px}.l1{top:19%;background:#8b443b55}.l2{top:38%;background:#9a7b2d4d}.l3{top:57%;background:#315f8655}.hit{position:absolute;top:35%;height:30%;width:5%;border:2px dashed #fff9;z-index:8}.hit.left{left:5%}.hit.right{right:5%}.castle{position:absolute;top:38%;width:12%;height:25%;z-index:12}.castle.left{left:0}.castle.right{right:0}.keep,.tower{position:absolute;bottom:0;background:linear-gradient(#b7bfc1,#55656a);border:3px solid #d1d6d7}.keep{left:25%;width:50%;height:55%}.tower{width:28%;height:72%}.tower.a{left:5%}.tower.b{right:5%}.unit{position:absolute;width:28px;height:28px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;z-index:20;font-weight:900}.blue{background:#2777c9}.red{background:#c94d4d}.battlebar{height:55px;background:#0b1b28;border-top:1px solid #5b6f7d;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:12px}@media(max-width:650px){.cards{grid-template-columns:1fr}.territory{width:62px;height:62px;font-size:9px}}
</style></head><body><header class="top"><div><b>Eldoria Strategy</b><small>　内政・出撃・戦闘</small></div><div class="tabs"><button id="tAdmin" class="active" onclick="screen('admin')">内政</button><button id="tMap" onclick="screen('map')">出撃</button></div></header>
<section id="admin" class="screen active"><div class="cards"><div class="card"><h2>部隊編成</h2><p>指揮官・副官・陣形・兵士を組み合わせて部隊を準備します。</p><button class="btn" onclick="toast('部隊編成画面は次の段階で接続します')">編成する</button></div><div class="card"><h2>クラスアップ</h2><p>同兵種・同クラス・同型のユニットを組み合わせます。</p><button class="btn" onclick="toast('クラスアップ画面は次の段階で接続します')">クラスアップ</button></div><div class="card"><h2>装備</h2><p>武器・防具・装飾品を装備します。</p><button class="btn" onclick="toast('装備画面は次の段階で接続します')">装備する</button></div><div class="card"><h2>徴兵</h2><p>新しい歩兵・弓兵・魔法兵を雇用します。</p><button class="btn" onclick="toast('徴兵画面は次の段階で接続します')">徴兵する</button></div><div class="card"><h2>探索</h2><p>探索で新しい装備品を獲得します。</p><button class="btn" onclick="toast('探索画面は次の段階で接続します')">探索する</button></div><div class="card"><h2>ゲームの流れ</h2><p>内政で準備 → 出撃画面で領地選択 → 攻撃 → 戦闘マップで自動戦闘。</p></div></div></section>
<section id="map" class="screen"><div class="map" id="mapArea"><div class="maptitle"><b>出撃画面</b><br><small>領地をタップしてください</small></div><div id="roads"></div><div class="territory central" data-id="central" style="left:50%;top:50%">中央王国</div><div class="territory aldia" data-id="aldia" style="left:28%;top:31%">アルディア<br>王国</div><div class="territory elf" data-id="elf" style="left:28%;top:69%">エルフリード<br>王国</div><div class="territory arc" data-id="arc" style="left:72%;top:69%">アルカディア<br>魔導国</div><div class="territory gran" data-id="gran" style="left:72%;top:31%">グランディア<br>帝国</div><div id="territoryPanel" class="panel"><h2 id="pName"></h2><p id="pOwner"></p><p id="pInfo"></p><div class="actions"><button class="btn" onclick="closePanel()">閉じる</button><button class="btn attack" onclick="attack()">攻撃</button></div></div></div></section>
<section id="battle" class="screen" style="flex-direction:column"><div class="battlebar"><span id="battleName">戦闘マップ</span><button class="btn" onclick="screen('map')">出撃画面へ戻る</button></div><div class="battle"><div class="lane l1"><span>上段</span></div><div class="lane l2"><span>中段</span></div><div class="lane l3"><span>下段</span></div><div class="hit left"></div><div class="hit right"></div><div class="castle left"><div class="tower a"></div><div class="tower b"></div><div class="keep"></div></div><div class="castle right"><div class="tower a"></div><div class="tower b"></div><div class="keep"></div></div><div id="units"></div></div><div class="battlebar"><span id="battleStatus">戦闘準備中</span><button class="btn" onclick="battleStart()">戦闘開始</button></div></section>
<div id="toast" style="position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#071725ee;border:1px solid #71828c;padding:9px 14px;border-radius:8px;display:none;z-index:100"></div>
<script>
const data={central:['中央王国','中央王国','首都領。国家レベルが高い領地。'],aldia:['アルディア王国','アルディア王国','王国領。'],elf:['エルフリード王国','エルフリード王国','王国領。'],arc:['アルカディア魔導国','アルカディア魔導国','魔導国領。'],gran:['グランディア帝国','グランディア帝国','帝国領。']};let selected=null,raf;
function screen(s){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(s).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));if(s==='admin')tAdmin.classList.add('active');if(s==='map'){tMap.classList.add('active');setTimeout(drawRoads,20)}}
function toast(s){let x=document.getElementById('toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',1600)}
const points={central:[.5,.5],aldia:[.28,.31],elf:[.28,.69],arc:[.72,.69],gran:[.72,.31]};const links=[['central','aldia'],['central','elf'],['central','arc'],['central','gran'],['aldia','elf'],['elf','arc'],['arc','gran'],['gran','aldia']];
function drawRoads(){let r=document.getElementById('roads'),m=document.getElementById('mapArea').getBoundingClientRect();r.innerHTML='';links.forEach(([a,b])=>{let A=points[a],B=points[b],x=A[0]*m.width,y=A[1]*m.height,X=B[0]*m.width,Y=B[1]*m.height,dX=X-x,dY=Y-y,e=document.createElement('div');e.className='road';e.style.left=x+'px';e.style.top=y+'px';e.style.width=Math.hypot(dX,dY)+'px';e.style.transform=`rotate(${Math.atan2(dY,dX)*180/Math.PI}deg)`;r.appendChild(e)})}
document.querySelectorAll('.territory').forEach(e=>e.onclick=()=>{selected=e.dataset.id;let d=data[selected];pName.textContent=d[0];pOwner.textContent='所属：'+d[1];pInfo.textContent=d[2];territoryPanel.classList.add('show')});function closePanel(){territoryPanel.classList.remove('show')}function attack(){closePanel();battleName.textContent=data[selected][0]+' 攻略戦';screen('battle');battleStart()}
function battleStart(){let box=document.querySelector('.battle'),layer=document.getElementById('units');layer.innerHTML='';let us=[],types=['infantry','archer','mage','infantry','archer'],ys=[.30,.49,.68,.30,.68];types.forEach((t,i)=>add('blue',t,ys[i],.11));types.forEach((t,i)=>add('red',t,ys[i],.89));let last=performance.now();cancelAnimationFrame(raf);battleStatus.textContent='自動戦闘中';function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;us.forEach(u=>{if(u.dead)return;let es=us.filter(v=>!v.dead&&v.side!==u.side),target=null;if(u.type==='infantry')target=es.filter(v=>Math.abs(v.y-u.y)<=.20&&Math.abs(v.x-u.x)*100<=5).sort((a,b)=>Math.abs(a.x-u.x)-Math.abs(b.x-u.x))[0];if(u.type==='mage')target=es.filter(v=>v.type==='infantry'&&Math.abs(v.x-u.x)*100<=15)[0]||es.filter(v=>v.type==='mage'&&Math.abs(v.x-u.x)*100<=15)[0];if(u.type==='archer')target=es.filter(v=>v.type==='mage'&&Math.abs(v.x-u.x)*100<=25)[0]||es.filter(v=>v.type==='archer'&&Math.abs(v.x-u.x)*100<=25)[0];if(target){u.cool-=dt;if(u.cool<=0){target.hp-=8;u.cool=u.int;target.x+=(u.side==='blue'?.012:-.012);if(target.hp<=0){target.dead=true;target.el.remove()}}}else{u.x+=(u.side==='blue'?1:-1)*dt*u.speed/100}if(u.side==='blue'&&u.x>=.95)u.x=.95;if(u.side==='red'&&u.x<=.05)u.x=.05;u.el.style.left=(u.x*box.clientWidth-14)+'px';u.el.style.top=(u.y*box.clientHeight-14)+'px'});let b=us.some(u=>u.side==='blue'&&!u.dead),r=us.some(u=>u.side==='red'&&!u.dead);if(!b||!r){battleStatus.textContent=b?'勝利（試作）':'敗北（試作）';return}raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);function add(side,type,y,x){let e=document.createElement('div');e.className='unit '+side;e.textContent=type==='mage'?'✦':type==='archer'?'➹':'⚔';layer.appendChild(e);us.push({side,type,y,x,hp:100,int:type==='infantry'?1:type==='archer'?2:3,cool:0,speed:type==='infantry'?14.29:type==='archer'?10:6.67,el:e,dead:false})}}
window.addEventListener('resize',drawRoads);screen('admin');
</script></body></html>
