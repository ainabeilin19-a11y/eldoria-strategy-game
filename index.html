<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>エルドリア戦略ゲーム Prototype index</title>
<style>
:root{--bg:#06131e;--panel:#0d1a27;--panel2:#142433;--text:#f5ecd5;--muted:#aeb9c3;--gold:#d9a441;--line:#d7d0b6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;background:#071521}
.top{padding:6px 8px;display:grid;grid-template-columns:190px 1fr 150px;gap:6px;align-items:stretch}
.card{background:linear-gradient(145deg,#172534,#0d1722);border:1px solid #526272;border-radius:14px;box-shadow:0 3px 12px #0007}
.badge{padding:7px;text-align:center}
.lv{font-size:34px;font-weight:900;color:#e7b54f;line-height:1}
.badge .name{font-size:16px;font-weight:800;margin-top:6px}
.progress{height:7px;background:#263443;border-radius:99px;overflow:hidden;margin:6px 4px 5px}
.progress i{display:block;height:100%;width:64%;background:#3c8acb}
.small{font-size:11px;color:var(--muted)}
.stats{padding:7px 9px;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.stat{font-size:13px}
.stat b{display:block;font-size:19px;color:#fff;margin-top:2px}
.year{padding:7px;text-align:center}
.year .big{font-size:19px;color:#e7b54f;font-weight:800;margin-top:5px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:5px}
.quick button{font-size:10px;padding:5px 2px}
.mapwrap{position:relative;padding:5px 6px 0}
svg{width:100%;height:auto;display:block;border:1px solid #536578;border-radius:14px;background:#06334a;touch-action:manipulation}
.land-border{fill:url(#land);stroke:#c7d0d3;stroke-width:5}
.terrain{opacity:.38}
.river{fill:none;stroke:#438fa5;stroke-width:10;opacity:.72}
.road{stroke:#f0e8d1;stroke-width:2.6;opacity:.78;pointer-events:none}
.territory{cursor:pointer;stroke:#fff;stroke-width:2.5;stroke-linejoin:round;transition:filter .12s,stroke-width .12s}
.territory:hover{filter:brightness(1.15)}
.territory.selected{stroke:#ffe08a;stroke-width:4;filter:brightness(1.13)}
.icon{font-size:29px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.territory-name{font-size:11px;fill:#fff;paint-order:stroke;stroke:#101820;stroke-width:3px;pointer-events:none;font-weight:700}
.legend{position:absolute;left:18px;top:18px;background:rgba(7,17,27,.94);border:1px solid #65717d;border-radius:10px;padding:9px;font-size:12px;z-index:2}
.legend div{display:flex;align-items:center;gap:6px;margin:5px 0}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block;flex:0 0 auto}
.map-note{padding:8px 12px;color:var(--muted);font-size:11px;text-align:center}
.detail{margin:8px;padding:10px;background:#0d1a27;border:1px solid #556473;border-radius:14px}
.detail-main{display:grid;grid-template-columns:230px 1fr;gap:12px;align-items:center}
.territory-art{height:155px;border-radius:12px;overflow:hidden;border:1px solid #9a8a69;background:#193244;box-shadow:inset 0 0 24px #0009,0 4px 14px #0007}
.territory-art svg{border:0;border-radius:0;height:100%;width:100%;background:none;display:block}
.detail h2{margin:0 0 5px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.metric{background:#172838;border-radius:10px;padding:8px;text-align:center}
.metric b{display:block;font-size:19px}
.detail-actions{display:flex;justify-content:flex-end;margin-top:9px}
.detail-actions button{min-width:90px}
.bottom{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:8px;position:sticky;bottom:0;background:#07131eeb;border-top:1px solid #344352;z-index:5;backdrop-filter:blur(8px)}
button{font:inherit;color:var(--text);background:#142536;border:1px solid #47596a;border-radius:10px;padding:9px 3px;min-width:0}
button.active{background:#5b431e;border-color:#d6a743}
@media(max-width:700px){.top{grid-template-columns:125px 1fr;padding:4px 6px;gap:5px}.year{display:none}.lv{font-size:29px}.badge .name{font-size:14px}.stats{padding:6px 8px}.stat{font-size:12px}.stat b{font-size:17px}.mapwrap{padding:4px 5px 0}.detail-main{grid-template-columns:170px 1fr}.territory-art{height:130px}}
@media(max-width:480px){.badge{width:auto}.badge .lv{font-size:27px}.badge .name{font-size:13px}.stats{font-size:11px}.territory-name{font-size:8px}.icon{font-size:25px}.detail-main{grid-template-columns:1fr}.territory-art{height:180px}.legend{font-size:10px;padding:7px}.legend div{margin:4px 0}}
</style>
</head>
<body>

    <div class="map-note">58領地・5か国／各国の領地はまとまりを持って配置。領地間には間隔を確保し、道路は指定された隣接領地のみを接続。</div>
  </div>

  <div class="detail" id="detail">
    <div class="detail-main">

      <div class="grid"><div class="metric">収入<b>100</b></div><div class="metric">兵力<b>100</b></div><div class="metric">防衛補正<b>未設定</b></div></div>
      <div class="detail-actions"><button id="detailBtn">詳細</button></div></div>
    </div>
  </div>

  <div class="bottom">
    <button class="active" data-mode="map">🗺️<br>マップ</button>
    <button data-mode="army">⚔️<br>部隊</button>
    <button data-mode="domestic">🏛️<br>内政</button>
    <button data-mode="land">🏰<br>領地</button>
    <button data-mode="diplomacy">🤝<br>外交</button>
    <button data-mode="other">⚙️<br>その他</button>
  </div>
</div>

<script>
const territories=[{"id":1,"country":"central","type":"capital","name":"ロイヤルシティ","income":100,"force":100,"x":520,"y":600},{"id":2,"country":"aldia","type":"town","name":"グリーンフォード","income":55,"force":30,"x":100,"y":480},{"id":3,"country":"aldia","type":"farm","name":"ウィンドミル","income":70,"force":20,"x":200,"y":480},{"id":4,"country":"aldia","type":"fort","name":"西部要塞","income":20,"force":65,"x":300,"y":480},{"id":5,"country":"aldia","type":"fort","name":"フォートレス","income":15,"force":55,"x":400,"y":480},{"id":6,"country":"aldia","type":"town","name":"ウェストガード","income":45,"force":35,"x":100,"y":600},{"id":7,"country":"aldia","type":"town","name":"サンセットポート","income":65,"force":25,"x":200,"y":600},{"id":8,"country":"aldia","type":"forest","name":"西部森林領","income":15,"force":10,"x":300,"y":600},{"id":9,"country":"aldia","type":"mountain","name":"西山岳領","income":10,"force":15,"x":400,"y":600},{"id":10,"country":"aldia","type":"mountain","name":"鉄壁高地","income":10,"force":15,"x":100,"y":720},{"id":11,"country":"aldia","type":"plain","name":"グリーンヒル","income":20,"force":15,"x":220,"y":720},{"id":12,"country":"aldia","type":"farm","name":"ウェストリバー","income":60,"force":20,"x":340,"y":720},{"id":13,"country":"aldia","type":"farm","name":"南西農地","income":80,"force":15,"x":140,"y":820},{"id":14,"country":"aldia","type":"mine","name":"西方鉱山","income":50,"force":30,"x":360,"y":820},{"id":15,"country":"elfrid","type":"town","name":"リーフォード","income":60,"force":30,"x":160,"y":100},{"id":16,"country":"elfrid","type":"town","name":"アイスベイ","income":45,"force":25,"x":280,"y":100},{"id":17,"country":"elfrid","type":"fort","name":"フロスト砦","income":20,"force":60,"x":400,"y":100},{"id":18,"country":"elfrid","type":"fort","name":"北境の要塞","income":15,"force":50,"x":520,"y":100},{"id":19,"country":"elfrid","type":"forest","name":"北部森林領","income":15,"force":10,"x":640,"y":100},{"id":20,"country":"elfrid","type":"farm","name":"北部農地","income":65,"force":20,"x":760,"y":100},{"id":21,"country":"elfrid","type":"mountain","name":"白銀山地","income":10,"force":15,"x":220,"y":220},{"id":22,"country":"elfrid","type":"town","name":"森林湖畔","income":40,"force":25,"x":340,"y":220},{"id":23,"country":"elfrid","type":"farm","name":"ノースリバー","income":55,"force":15,"x":460,"y":220},{"id":24,"country":"elfrid","type":"plain","name":"北方丘陵","income":15,"force":10,"x":580,"y":220},{"id":25,"country":"elfrid","type":"forest","name":"フォレストヒル","income":20,"force":15,"x":700,"y":220},{"id":26,"country":"elfrid","type":"forest","name":"北東森林領","income":10,"force":10,"x":440,"y":400},{"id":27,"country":"elfrid","type":"farm","name":"ゴールデンフィールド","income":75,"force":15,"x":560,"y":400},{"id":28,"country":"arcadia","type":"town","name":"ホワイトヘブン","income":65,"force":35,"x":640,"y":500},{"id":29,"country":"arcadia","type":"town","name":"サンライト","income":55,"force":25,"x":760,"y":500},{"id":30,"country":"arcadia","type":"town","name":"ドラゴンゲート","income":50,"force":35,"x":880,"y":500},{"id":31,"country":"arcadia","type":"fort","name":"バーバータワー要塞","income":15,"force":55,"x":640,"y":620},{"id":32,"country":"arcadia","type":"fort","name":"ストーンウォール要塞","income":20,"force":60,"x":760,"y":620},{"id":33,"country":"arcadia","type":"forest","name":"イーストウッド","income":15,"force":10,"x":880,"y":620},{"id":34,"country":"arcadia","type":"town","name":"魔導研究都市","income":70,"force":30,"x":640,"y":740},{"id":35,"country":"arcadia","type":"forest","name":"東部森林領","income":10,"force":10,"x":760,"y":740},{"id":36,"country":"arcadia","type":"mine","name":"クリスタル鉱山","income":55,"force":35,"x":880,"y":740},{"id":37,"country":"arcadia","type":"farm","name":"東部農業地帯","income":60,"force":20,"x":680,"y":820},{"id":38,"country":"arcadia","type":"mountain","name":"魔導高地","income":10,"force":15,"x":760,"y":860},{"id":39,"country":"arcadia","type":"mine","name":"東部鉱山","income":45,"force":30,"x":880,"y":860},{"id":40,"country":"arcadia","type":"forest","name":"グレイウッドの森","income":20,"force":15,"x":800,"y":920},{"id":41,"country":"grandia","type":"town","name":"サンドシティ","income":50,"force":25,"x":100,"y":920},{"id":42,"country":"grandia","type":"town","name":"ダストホールド","income":40,"force":30,"x":220,"y":920},{"id":43,"country":"grandia","type":"town","name":"ブライトキャッスル","income":55,"force":25,"x":340,"y":920},{"id":44,"country":"grandia","type":"town","name":"サンライズポート","income":70,"force":30,"x":460,"y":820},{"id":45,"country":"grandia","type":"plain","name":"レッドデューン","income":15,"force":10,"x":580,"y":820},{"id":46,"country":"grandia","type":"town","name":"スカルロック","income":10,"force":15,"x":700,"y":920},{"id":47,"country":"grandia","type":"farm","name":"南部農地","income":80,"force":25,"x":120,"y":1010},{"id":48,"country":"grandia","type":"plain","name":"南部平原","income":20,"force":15,"x":240,"y":1010},{"id":49,"country":"grandia","type":"farm","name":"南東農地","income":70,"force":20,"x":360,"y":1010},{"id":50,"country":"grandia","type":"plain","name":"南西平原","income":15,"force":10,"x":480,"y":1010},{"id":51,"country":"grandia","type":"town","name":"南部鉱山","income":45,"force":30,"x":600,"y":1010},{"id":52,"country":"grandia","type":"forest","name":"南部森林","income":10,"force":10,"x":720,"y":1010},{"id":53,"country":"grandia","type":"plain","name":"グランディア平原","income":25,"force":15,"x":820,"y":1020},{"id":54,"country":"grandia","type":"town","name":"南方要塞","income":20,"force":55,"x":180,"y":1100},{"id":55,"country":"grandia","type":"farm","name":"東南農村","income":60,"force":20,"x":340,"y":1100},{"id":56,"country":"grandia","type":"farm","name":"西南農村","income":75,"force":25,"x":500,"y":1100},{"id":57,"country":"grandia","type":"town","name":"南部港湾","income":60,"force":30,"x":680,"y":1100},{"id":58,"country":"grandia","type":"town","name":"大帝国領","income":80,"force":70,"x":840,"y":1110}];
const countries={"central":{"name":"中央王国","color":"#b84a45","level":10,"capital":"ロイヤルシティ","style":"少数精鋭"},"aldia":{"name":"アルディア王国","color":"#3979c8","level":5,"capital":"グリーンフォード","style":"歩兵主力"},"elfrid":{"name":"エルフリード王国","color":"#55a064","level":5,"capital":"リーフォード","style":"弓兵主力"},"arcadia":{"name":"アルカディア魔導国","color":"#8554b8","level":5,"capital":"ホワイトヘブン","style":"魔法兵主力"},"grandia":{"name":"グランディア帝国","color":"#c28c27","level":4,"capital":"サンドシティ","style":"低品質・大量"}};
const typeNames={capital:"大都市",town:"街",mine:"鉱山",farm:"農村",fort:"要塞",plain:"平原",forest:"森林",mountain:"山岳"};
const icons={capital:"🏰",town:"🏛",mine:"⛏",farm:"🌾",fort:"🛡",plain:"◆",forest:"🌲",mountain:"▲"};
const svgNS="http://www.w3.org/2000/svg";
const nodes=document.getElementById("territories"),roadsG=document.getElementById("roads"),detail=document.getElementById("detail"),art=document.getElementById("art");

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function byId(){return Object.fromEntries(territories.map(t=>[t.id,t]))}

function hexPoints(cx,cy,r=32) {
  const pts=[];
  for(let i=0;i<6;i++) {
    const a=(Math.PI/3)*i+Math.PI/6;
    pts.push(`${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`);
  }
  return pts.join(" ");
}

// 領地の接続は国ごとの近接領地を自動で結び、国境と中央王国にも主要道路を追加。
// これにより、旧版の格子状・極端な接続を避ける。
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function addRoadPair(set,a,b){if(a===b)return;const k=a<b?`${a}-${b}`:`${b}-${a}`;set.add(k)}
function buildRoads(){
  const map=byId();
  const ts=territories.slice();
  const edges=[];

  function d(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

  // まずは「同じ国」の領地だけを、実際に近いもの同士で接続する。
  // 国をまたぐ道路は自動生成せず、下の国境接続だけを明示する。
  for(let i=0;i<ts.length;i++){
    for(let j=i+1;j<ts.length;j++){
      const A=ts[i],B=ts[j];
      if(A.country!==B.country) continue;

      const len=d(A,B);
      if(len>155) continue;

      const mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
      let blocked=false;

      // 途中に別の領地がある場合は飛び越して接続しない。
      for(let k=0;k<ts.length;k++){
        if(k===i || k===j) continue;
        const P=ts[k];
        if(Math.hypot(P.x-mx,P.y-my) < len/2-3){
          blocked=true;
          break;
        }
      }

      if(!blocked) edges.push([A,B,len]);
    }
  }

  const keep=new Map();

  function add(a,b){
    if(!a || !b || a.id===b.id) return;
    const key=a.id<b.id ? `${a.id}-${b.id}` : `${b.id}-${a.id}`;
    keep.set(key,[a,b]);
  }

  edges.sort((a,b)=>a[2]-b[2]);
  edges.forEach(([a,b])=>add(a,b));

  // 国境は「隣接国同士」を明示的に2ヶ所以上で接続。
  // 領地間に十分な空間を残すため、道路は領地の中心同士を結ぶ。
  const required=[
    [1,9],[1,5],       // 中央 ↔ アルディア
    [1,26],[1,27],     // 中央 ↔ エルフリード
    [1,28],[1,34],     // 中央 ↔ アルカディア
    [1,44],[1,45],     // 中央 ↔ グランディア

    [4,26],[5,27],     // アルディア ↔ エルフリード
    [14,44],[13,41],   // アルディア ↔ グランディア
    [26,28],[27,28],   // エルフリード ↔ アルカディア
    [37,45],[40,46]    // アルカディア ↔ グランディア
  ];

  for(const [a,b] of required){
    const A=map[a],B=map[b];
    if(A && B) add(A,B);
  }

  // 青線で指定された追加道路。
  // 既存道路とは別の接続として追加し、道路同士が同じ2領地を結ぶ重複は作らない。
  const extraRoads=[
    [22,26], // 森林湖畔 ↔ 北東森林領
    [23,27], // ノースリバー ↔ ゴールデンフィールド
    [25,27], // フォレストヒル ↔ ゴールデンフィールド

    [13,42], // 南西農地 ↔ ダストホールド
    [14,43], // 西方鉱山 ↔ ブライトキャッスル
    [43,56], // ブライトキャッスル ↔ 西南農村
    [44,51], // サンライズポート ↔ 南部鉱山

    [37,46], // 東部農業地帯 ↔ スカルロック
    [38,46], // 魔導高地 ↔ スカルロック
    [46,40], // スカルロック ↔ グレイウッドの森
    [40,53]  // グレイウッドの森 ↔ グランディア平原
  ];

  for(const [a,b] of extraRoads){
    const A=map[a],B=map[b];
    if(A && B) add(A,B);
  }

  // 同じ国の中で道路がない領地だけ、最も近い同国領地へ接続。
  for(const A of ts){
    let has=false;
    for(const [a,b] of keep.values()){
      if(a.id===A.id || b.id===A.id){ has=true; break; }
    }
    if(!has){
      const candidates=ts
        .filter(x=>x.id!==A.id && x.country===A.country)
        .sort((x,y)=>d(A,x)-d(A,y));
      const B=candidates[0];
      if(B && d(A,B)<=155) add(A,B);
    }
  }

  const curvedRoutes={
    "43-56":[430,1035] // ブライトキャッスルから西南農村へ、既存の横道路を避ける
  };

  for(const [A,B] of keep.values()){
    const key=A.id<B.id ? `${A.id}-${B.id}` : `${B.id}-${A.id}`;
    if(curvedRoutes[key]){
      const [cx,cy]=curvedRoutes[key];
      const path=document.createElementNS(svgNS,"path");
      path.setAttribute("d",`M ${A.x} ${A.y} Q ${cx} ${cy} ${B.x} ${B.y}`);
      path.setAttribute("class","road");
      path.setAttribute("fill","none");
      path.setAttribute("stroke-linecap","round");
      path.setAttribute("stroke-linejoin","round");
      roadsG.appendChild(path);
    }else{
      const line=document.createElementNS(svgNS,"line");
      line.setAttribute("x1",A.x);
      line.setAttribute("y1",A.y);
      line.setAttribute("x2",B.x);
      line.setAttribute("y2",B.y);
      line.setAttribute("class","road");
      line.setAttribute("stroke-linecap","round");
      line.setAttribute("stroke-linejoin","round");
      roadsG.appendChild(line);
    }
  }
}

function artSvg(t){
  const c=countries[t.country];

  const defs=`
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#162f45"/>
        <stop offset=".58" stop-color="#5c8290"/>
        <stop offset="1" stop-color="#c7a66a"/>
      </linearGradient>
      <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#66834d"/>
        <stop offset="1" stop-color="#2e4d38"/>
      </linearGradient>
      <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
        <stop stop-color="#e4ded0"/><stop offset=".55" stop-color="#a9a9a3"/><stop offset="1" stop-color="#626d73"/>
      </linearGradient>
      <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
        <stop stop-color="#c9574c"/><stop offset="1" stop-color="#642b2d"/>
      </linearGradient>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".55"/>
      </filter>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2"/>
      </filter>
      <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="4" r="1" fill="#fff" opacity=".10"/>
        <circle cx="13" cy="12" r="1" fill="#000" opacity=".10"/>
      </pattern>
    </defs>`;

  const base=`
    <rect width="300" height="180" fill="url(#sky)"/>
    <path d="M0 108 Q65 82 125 106 T300 91 V180 H0Z" fill="url(#ground)"/>
    <path d="M0 135 Q65 111 135 133 T300 119" fill="none" stroke="#b7a36c" stroke-width="2" opacity=".45"/>
    <rect width="300" height="180" fill="url(#grain)" opacity=".6"/>`;

  function trees(){
    return `
      <g filter="url(#shadow)">
        <g fill="#173d2a" stroke="#2b6242" stroke-width="2">
          <path d="M30 128l14-38 14 38zM36 112l8-25 8 25z"/>
          <path d="M88 127l17-45 17 45zM95 106l10-28 10 28z"/>
          <path d="M235 129l16-43 16 43zM242 108l9-27 9 27z"/>
          <path d="M268 130l13-35 13 35zM274 111l7-22 7 22z"/>
        </g>
      </g>`;
  }

  function town(){
    return `
      ${trees()}
      <g filter="url(#shadow)">
        <rect x="77" y="83" width="146" height="54" rx="3" fill="url(#stone)" stroke="#4e5557" stroke-width="2"/>
        <path d="M68 86 L105 54 L143 86Z" fill="url(#roof)" stroke="#512b2d" stroke-width="2"/>
        <path d="M155 86 L191 51 L231 86Z" fill="url(#roof)" stroke="#512b2d" stroke-width="2"/>
        <rect x="91" y="100" width="22" height="37" fill="#76583e"/>
        <rect x="174" y="100" width="22" height="37" fill="#76583e"/>
        <g fill="#8fc1ce" stroke="#354951" stroke-width="2">
          <rect x="122" y="98" width="17" height="17"/><rect x="144" y="98" width="17" height="17"/>
        </g>
        <path d="M69 139H231" stroke="#e4d9bd" stroke-width="5"/>
      </g>`;
  }

  let scene=base;

  if(t.type==="forest"){
    scene=`
      <rect width="300" height="180" fill="url(#sky)"/>
      <path d="M0 105 Q70 78 145 104 T300 88 V180 H0Z" fill="#385f3e"/>
      ${trees()}
      <g opacity=".9">
        <path d="M120 130 Q145 104 169 130" fill="none" stroke="#d5c18a" stroke-width="4"/>
        <path d="M130 130v-24M158 130v-24" stroke="#6b5137" stroke-width="4"/>
      </g>
      <rect width="300" height="180" fill="url(#grain)" opacity=".5"/>`;
  } else if(t.type==="mountain"){
    scene=`
      <rect width="300" height="180" fill="url(#sky)"/>
      <path d="M0 150 L58 58 L108 120 L164 34 L235 120 L275 70 L320 150Z" fill="#3f4d54" stroke="#27343b" stroke-width="3"/>
      <path d="M58 58l-21 34 24-10 20 16zM164 34l-28 45 31-15 28 18zM275 70l-18 29 21-9 18 13z" fill="#e5e6df"/>
      <path d="M0 151 Q75 125 150 148 T300 140 V180 H0Z" fill="#435b42"/>
      <path d="M25 153h250" stroke="#c7a86d" stroke-width="3" opacity=".7"/>`;
  } else if(t.type==="farm"){
    scene=`
      <rect width="300" height="180" fill="url(#sky)"/>
      <path d="M0 110 Q80 80 150 108 T300 95 V180 H0Z" fill="#647744"/>
      <g stroke="#c5ad5c" stroke-width="5" opacity=".95">
        <path d="M12 166L95 112M55 180L142 122M125 180L212 120M190 180L278 122"/>
      </g>
      <g fill="#b8a044"><circle cx="45" cy="128" r="5"/><circle cx="110" cy="118" r="5"/><circle cx="175" cy="132" r="5"/><circle cx="245" cy="124" r="5"/></g>
      <g filter="url(#shadow)">
        <path d="M104 108v-38h55v38" fill="#e0d7c4" stroke="#5c5549" stroke-width="2"/>
        <path d="M96 72l35-28 37 28z" fill="url(#roof)" stroke="#542d2d" stroke-width="2"/>
        <rect x="126" y="83" width="14" height="25" fill="#77553b"/>
      </g>`;
  } else if(t.type==="mine"){
    scene=`
      <rect width="300" height="180" fill="url(#sky)"/>
      <path d="M0 125 L62 80 L112 112 L168 54 L230 110 L300 76 V180 H0Z" fill="#424b50"/>
      <path d="M70 148 V96 Q110 62 150 96 V148" fill="#20282c" stroke="#151b1e" stroke-width="6"/>
      <path d="M58 150h112" stroke="#c58d37" stroke-width="8"/>
      <path d="M80 150h90" stroke="#6f4d2d" stroke-width="3"/>
      <circle cx="202" cy="106" r="13" fill="#d7a84d"/><circle cx="202" cy="106" r="6" fill="#fff0a8"/>
      <path d="M213 145l24-35M213 145l-20-28" stroke="#c9a24b" stroke-width="7"/>`;
  } else if(t.type==="fort"){
    scene=`
      <rect width="300" height="180" fill="url(#sky)"/>
      <path d="M0 128 Q75 96 150 124 T300 108 V180 H0Z" fill="#465d46"/>
      <g filter="url(#shadow)">
        <path d="M45 140V78H72V58H98V78H202V58H228V78H255V140Z" fill="url(#stone)" stroke="#50575b" stroke-width="3"/>
        <path d="M54 82h192" stroke="#d7d1c4" stroke-width="5"/>
        <g fill="#313c44"><rect x="78" y="91" width="15" height="12"/><rect x="108" y="91" width="15" height="12"/><rect x="178" y="91" width="15" height="12"/><rect x="208" y="91" width="15" height="12"/></g>
        <rect x="135" y="102" width="30" height="38" fill="#5b4030"/>
        <path d="M130 102h40" stroke="#d8c49b" stroke-width="3"/>
      </g>`;
  } else if(t.type==="capital"){
    scene=`
      <rect width="300" height="180" fill="url(#sky)"/>
      <path d="M0 132 Q75 96 150 126 T300 112 V180 H0Z" fill="#3f6542"/>
      <g filter="url(#shadow)">
        <path d="M48 140V76H252V140Z" fill="url(#stone)" stroke="#4c5154" stroke-width="3"/>
        <path d="M38 78L78 39L118 78Z M108 78L150 26L192 78Z M182 78L222 39L262 78Z" fill="url(#roof)" stroke="#542b2e" stroke-width="3"/>
        <rect x="135" y="96" width="30" height="44" fill="#6e4d35"/>
        <path d="M128 96h44" stroke="#d8c69f" stroke-width="4"/>
        <g fill="#91c3cc" stroke="#384a50" stroke-width="2">
          <rect x="70" y="92" width="22" height="22"/><rect x="99" y="92" width="22" height="22"/>
          <rect x="179" y="92" width="22" height="22"/><rect x="208" y="92" width="22" height="22"/>
        </g>
        <path d="M150 26V12" stroke="#d7c18c" stroke-width="3"/>
        <path d="M150 12l22 7-22 7z" fill="${c.color}"/>
      </g>`;
  } else {
    scene=town();
  }

  return `<svg viewBox="0 0 300 180" aria-label="${esc(t.name)}の景観">
    ${defs}${scene}
    <rect x="7" y="7" width="286" height="166" rx="10" fill="none" stroke="#e7d6ad" stroke-width="2" opacity=".65"/>
    <rect x="12" y="12" width="276" height="30" rx="7" fill="#081521" opacity=".78"/>
    <circle cx="28" cy="27" r="6" fill="${c.color}"/>
    <text x="42" y="32" fill="#fff" font-size="13" font-weight="800">${esc(t.name)}</text>
  </svg>`;
}

function drawTerritories(){
  territories.forEach(t=>{
    const g=document.createElementNS(svgNS,"g"); g.dataset.id=t.id;
    const c=countries[t.country];
    const poly=document.createElementNS(svgNS,"polygon");
    poly.setAttribute("points",hexPoints(t.x,t.y,32));
    poly.setAttribute("fill",c.color);
    poly.setAttribute("fill-opacity",t.country==="central" ? ".94" : ".82");
    poly.setAttribute("class","territory");
    g.appendChild(poly);

    const icon=document.createElementNS(svgNS,"text");
    icon.setAttribute("x",t.x);icon.setAttribute("y",t.y-3);icon.setAttribute("class","icon");
    icon.textContent=icons[t.type]||"◆";g.appendChild(icon);

    const text=document.createElementNS(svgNS,"text");
    const right=t.x>720;
    text.setAttribute("x",right?t.x-42:t.x+42);
    text.setAttribute("y",t.y+4);
    text.setAttribute("text-anchor",right?"end":"start");
    text.setAttribute("class","territory-name");
    text.textContent=t.name;g.appendChild(text);

    const title=document.createElementNS(svgNS,"title");
    title.textContent=t.name+" / "+c.name;g.appendChild(title);
    g.addEventListener("click",()=>select(t.id));
    nodes.appendChild(g);
  });
}

function select(id){
  document.querySelectorAll(".territory").forEach(x=>x.classList.remove("selected"));
  const g=document.querySelector(`[data-id="${id}"]`);
  if(g) g.querySelector(".territory").classList.add("selected");
  const t=territories.find(x=>x.id===id),c=countries[t.country];
  art.innerHTML=artSvg(t);
  detail.innerHTML=`<div class="detail-main"><div class="territory-art" id="art">${artSvg(t)}</div>
  <div><h2>${esc(t.name)} <span class="small">${esc(c.name)} / ${typeNames[t.type]}</span></h2>
  <div class="small">首都: ${esc(c.capital)}　国家Lv.${c.level}　部隊レベル加算 +${c.level}</div>
  <div class="grid"><div class="metric">収入<b>${t.income}</b></div><div class="metric">兵力<b>${t.force}</b></div><div class="metric">防衛補正<b>未設定</b></div></div>
  <div class="detail-actions"><button id="detailBtn">詳細</button></div></div></div>`;
}

function makeLegend(){
  document.getElementById("legend").innerHTML=Object.entries(countries).map(([k,c])=>
    `<div><span class="dot" style="background:${c.color}"></span>${c.name} (${territories.filter(t=>t.country===k).length})</div>`).join("");
}
function updateHeader(){
  const central=territories.filter(t=>t.country==="central");
  document.getElementById("income").textContent=central.reduce((s,t)=>s+t.income,0);
  document.getElementById("force").textContent=central.reduce((s,t)=>s+t.force,0);
  document.getElementById("lands").textContent=central.length+" / 58";
}
document.querySelectorAll(".bottom button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".bottom button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  if(b.dataset.mode==="map") select(1);
  else detail.innerHTML=`<div class="detail-main"><div class="territory-art"><svg viewBox="0 0 300 180"><rect width="300" height="180" fill="#172838"/><text x="150" y="95" text-anchor="middle" fill="#e8b44d" font-size="22">${b.textContent.replace(/\n/g," ")}</text></svg></div><div><h2>${b.textContent.replace(/\n/g," ")}</h2><div class="small">この画面は次の開発段階で実装します。</div></div></div>`;
}));

buildRoads();drawTerritories();updateHeader();select(1);
</script>
