<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小戦闘マップ</title><style>
*{box-sizing:border-box}body{margin:0;background:#07131d;color:#eee;font-family:system-ui,sans-serif}.app{max-width:1100px;margin:auto;padding:10px}.box{background:#102332;border:1px solid #5b7180;border-radius:12px;padding:10px;margin-bottom:10px}h1,h2{margin:4px 0 8px}h1{font-size:24px}h2{font-size:17px;color:#f0d27b}.battle{height:560px;position:relative;overflow:hidden;border:2px solid #718696;border-radius:16px;background:linear-gradient(#55705c,#304b3d 55%,#263e35)}.lane{position:absolute;left:15%;right:15%;height:25%;border:1px solid #ffffff77;clip-path:polygon(3% 12%,97% 0,100% 88%,2% 100%);}.top{top:18%;background:#8b4b4238}.mid{top:37.5%;background:#b58d3a38}.low{top:57%;background:#3d6f9438}.lane b{position:absolute;left:8px;top:7px;font-size:12px;background:#07131dcc;padding:4px 7px;border-radius:6px}.base{position:absolute;top:34%;width:12%;height:31%;z-index:5}.base.left{left:1%}.base.right{right:1%}.castle{height:100%;margin:auto;width:80%;background:linear-gradient(90deg,#4c5c63,#adb5b5,#4b595f);clip-path:polygon(0 25%,15% 25%,15% 0,35% 0,35% 22%,65% 22%,65% 0,85% 0,85% 25%,100% 25%,100% 100%,0 100%);border:4px solid #c3c8c9}.hit{position:absolute;top:50%;width:5%;height:68%;transform:translateY(-50%);border:2px dashed #fff9;background:#fff1;border-radius:8px;z-index:8}.hit.left{left:5%}.hit.right{right:5%}.hit span{font-size:9px;writing-mode:vertical-rl;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap}.unit{position:absolute;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white;z-index:20;font-weight:900;box-shadow:0 3px 8px #0009;transition:transform .05s}.blue{background:#2778d0}.red{background:#c64b4b}.dead{display:none}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:320px}.cell{height:62px;background:#172c3c;color:white;border:1px solid #667d8d;border-radius:7px;font-weight:800}.cell.off{opacity:.35}.cell.sel{background:#1d6797}.row{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}select,button{background:#0a1925;color:#fff;border:1px solid #657b8b;border-radius:7px;padding:8px}button{cursor:pointer}button:hover{background:#18374d}.small{font-size:12px;color:#c6d2d9;line-height:1.6}.status{font-size:13px;margin-top:7px}.legend{display:flex;gap:5px;flex-wrap:wrap}.tag{padding:4px 7px;border-radius:5px;background:#193246;font-size:12px}@media(max-width:700px){.battle{height:460px}.grid{grid-template-columns:1fr}.base{width:14%}.unit{width:25px;height:25px;font-size:11px}}
</style></head><body><div class="app"><div class="box"><h1>小戦闘マップ</h1><div class="small">戦闘前に陣形へ1～5体を配置。戦闘開始後は隊列を解除し、各ユニットが独立して移動・攻撃します。</div></div>
<div class="battle" id="battle"><div class="lane top"><b>上段</b></div><div class="lane mid"><b>中段</b></div><div class="lane low"><b>下段</b></div><div class="hit left"><span>自軍拠点判定</span></div><div class="hit right"><span>敵拠点判定</span></div><div class="base left"><div class="castle"></div></div><div class="base right"><div class="castle"></div></div><div id="units"></div></div>
<div class="grid"><div class="box"><h2>戦闘前の編成</h2><div class="row"><select id="formation"><option value="basic">基本の陣</option><option value="assault">猛攻の陣</option><option value="fortress">鉄壁の陣</option><option value="melee">白兵の陣</option><option value="volley">斉射の陣</option><option value="magic">魔撃の陣</option><option value="support">援射の陣</option><option value="charge">猪突の陣</option><option value="swift">疾風の陣</option><option value="deploy">出撃の陣</option><option value="war">戦神の陣</option></select><select id="type"><option value="infantry">歩兵</option><option value="archer">弓兵</option><option value="mage">魔法兵</option></select><select id="speed"><option>A</option><option>B</option><option>C</option></select></div><div class="cells" id="cells"></div><div class="row"><select id="lane"><option value="top">上段へ出撃</option><option value="mid">中段へ出撃</option><option value="low">下段へ出撃</option></select><button id="save">編成を保存</button><button id="start">戦闘開始・自動出撃</button><button id="reset">リセット</button></div><div class="status" id="formStatus">1～5体を配置してください。</div></div>
<div class="box"><h2>現在の戦闘ルール</h2><div class="legend"><span class="tag">歩兵：前進→接触した敵を攻撃</span><span class="tag">弓兵：魔法兵を優先</span><span class="tag">魔法兵：歩兵を優先</span></div><p class="small">遠距離攻撃はレーンを無視して射程内の敵を攻撃。拠点への攻撃は遠距離攻撃をせず、拠点判定へ到達したユニットの体当たりのみ。</p><p class="small">素早さ：A＝7秒移動・1秒間隔、B＝10秒・2秒、C＝15秒・3秒。射程：歩兵5、弓兵25、魔法兵15（拠点間距離100基準）。</p><p class="small" id="effect">基本の陣：攻撃+5% 防御+5% HP+5%</p></div></div></div>
<script>
const F={basic:[[1,0,1],[0,1,0],[1,0,1]],assault:[[1,0,1],[0,0,1],[1,0,1]],fortress:[[0,1,1],[0,0,1],[0,1,1]],melee:[[0,0,1],[1,1,1],[0,0,1]],volley:[[0,1,1],[1,0,0],[0,1,1]],magic:[[1,0,0],[1,1,1],[1,0,0]],support:[[1,1,0],[1,0,0],[1,1,0]],charge:[[1,1,0],[0,0,1],[1,1,0]],swift:[[0,1,0],[0,0,1],[1,1,1]],deploy:[[0,1,0],[1,1,1],[0,1,0]],war:[[1,0,1],[1,0,0],[1,0,1]]};
const E={basic:'攻撃+5% 防御+5% HP+5%',assault:'与ダメージ+20% 防御-5% HP-5%',fortress:'攻撃-15% 防御+15% HP+15%',melee:'歩兵攻撃+15% 防御+15%／遠距離攻撃を1回ノックバック無効／弓・魔法攻撃-10%',volley:'弓攻撃+15% 防御+15% 射程+10%／歩兵攻撃-10% 防御-15%',magic:'魔法攻撃+15% 防御+15% 射程+10%／歩兵攻撃-10% 防御-15%',support:'弓・魔法防御+20% 射程+10% 攻撃速度10%上昇',charge:'敵ノックバック+30% 自軍ノックバック-25% クリティカル率+10% クリティカルダメージ+15%',swift:'素早さ+25%／歩兵ノックバック1回無効／拠点ダメージ+20%',deploy:'出撃時間-20%',war:'全能力強化＋射程＋ノックバック＋クリティカル＋出撃時間短縮（ネタ）'};
const names={infantry:'歩兵',archer:'弓兵',mage:'魔法兵'};const range={infantry:5,archer:25,mage:15};const speed={A:{t:7,i:1},B:{t:10,i:2},C:{t:15,i:3}};const y={top:.30,mid:.49,low:.68};
let selected=Array(9).fill(null),formation=null,units=[],run=false,last=0,uid=0,time=300;
const cells=document.getElementById('cells'), effect=document.getElementById('effect'), fs=document.getElementById('formStatus'), unitBox=document.getElementById('units');
function renderCells(){const f=F[document.getElementById('formation').value];cells.innerHTML='';f.flat().forEach((ok,i)=>{let b=document.createElement('button');b.className='cell '+(ok?'':'off')+(selected[i]?' sel':'');b.disabled=!ok;b.textContent=ok?(selected[i]?names[selected[i]]:'○'):'✕';b.onclick=()=>{if(selected[i])selected[i]=null;else if(selected.filter(Boolean).length<5)selected[i]=document.getElementById('type').value;else fs.textContent='1編成あたり最大5体です。';renderCells()};cells.appendChild(b)});effect.textContent=(document.getElementById('formation').selectedOptions[0].textContent)+'：'+E[document.getElementById('formation').value]}
document.getElementById('formation').onchange=()=>{selected=Array(9).fill(null);renderCells()};document.getElementById('type').onchange=renderCells;renderCells();
document.getElementById('save').onclick=()=>{let a=selected.filter(Boolean);if(!a.length)return fs.textContent='1体以上配置してください。';formation={cells:[...selected],units:a,lane:document.getElementById('lane').value,speed:document.getElementById('speed').value,formation:document.getElementById('formation').value};fs.textContent='編成を保存しました：'+a.length+'体／'+({top:'上段',mid:'中段',low:'下段'}[formation.lane])+'／素早さ'+formation.speed};
function unit(side,lane,type,x,s){let e=document.createElement('div');e.className='unit '+side;e.textContent=type==='infantry'?'⚔':type==='archer'?'➹':'✦';unitBox.appendChild(e);return{id:++uid,side,lane,type,x,s,hp:100,atk:type==='infantry'?25:type==='archer'?24:17,def:type==='infantry'?18:type==='archer'?5:8,cd:0,el:e,dead:false,base:false}}
function d(a,b){return Math.abs(a.x-b.x)*100}function adj(a,b){return Math.abs({top:0,mid:1,low:2}[a.lane]-{top:0,mid:1,low:2}[b.lane])<=1}
function target(u){let es=units.filter(v=>!v.dead&&v.side!==u.side&&!v.base&&d(u,v)<=range[u.type]);if(u.type==='infantry')return es.filter(v=>adj(u,v)).sort((a,b)=>d(u,a)-d(u,b))[0];let pref=u.type==='mage'?es.filter(v=>v.type==='infantry'):es.filter(v=>v.type==='mage');if(pref.length)return pref.sort((a,b)=>d(u,a)-d(u,b))[0];let sec=es.filter(v=>v.type===u.type);return (sec[0]||es[0]);}
function hit(u,v){let z=u.atk-v.def/2;let good=(u.type==='infantry'&&v.type==='archer')||(u.type==='archer'&&v.type==='mage')||(u.type==='mage'&&v.type==='infantry');let bad=(u.type==='infantry'&&v.type==='mage')||(u.type==='archer'&&v.type==='infantry')||(u.type==='mage'&&v.type==='archer');if(good)z*=2;if(bad)z*=.5;v.hp-=Math.max(1,Math.round(z));v.x+=(u.side==='blue'?.006:-.006);if(v.hp<=0){v.dead=true;v.el.remove()}}
function draw(){units.forEach(u=>{if(!u.dead){u.el.style.left=(u.x*battle.clientWidth-15)+'px';u.el.style.top=(y[u.lane]*battle.clientHeight-15)+'px'}})}
function start(){if(!formation)return fs.textContent='先に編成を保存してください。';if(run)return;units=[];unitBox.innerHTML='';let off=[-.035,-.018,0,.018,.035];formation.units.forEach((t,i)=>units.push(unit('blue',formation.lane,t,.10+off[i],formation.speed)));let enemy=['infantry','archer','mage','infantry','archer'];enemy.slice(0,formation.units.length).forEach((t,i)=>units.push(unit('red',formation.lane,t,.90-off[i],formation.speed)));run=true;time=300;last=performance.now();fs.textContent='戦闘開始。9マス配置を解除し、各ユニットが独立して進軍します。';requestAnimationFrame(loop)}
document.getElementById('start').onclick=start;
function loop(now){if(!run)return;let dt=Math.min(.05,(now-last)/1000);last=now;units.forEach(u=>{if(u.dead)return;u.cd=Math.max(0,u.cd-dt);if((u.side==='blue'&&u.x>=.95)||(u.side==='red'&&u.x<=.05)){u.base=true;if(u.cd<=0)u.cd=speed[u.s].i;return}let v=target(u);if(v&&u.cd<=0){hit(u,v);u.cd=speed[u.s].i}else if(!v){let dir=u.side==='blue'?1:-1;u.x+=dir*(100/speed[u.s].t)/100*dt} });draw();units=units.filter(u=>!u.dead);if(!units.some(u=>u.side==='blue')||!units.some(u=>u.side==='red')){run=false;fs.textContent='部隊戦闘終了（拠点ダメージは次段階で接続）';return}requestAnimationFrame(loop)}
document.getElementById('reset').onclick=()=>{run=false;units=[];unitBox.innerHTML='';formation=null;selected=Array(9).fill(null);renderCells();fs.textContent='1～5体を配置してください。'};setInterval(()=>{if(run){time--;if(time<=0){run=false;fs.textContent='制限時間終了：敗北';}}},1000);window.onresize=draw;
</script></body></html>
