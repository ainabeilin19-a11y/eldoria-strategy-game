<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>エルドリア戦略ゲーム Prototype</title>
<style>
:root {
  --bg:#07131e; --panel:#111c28; --panel2:#182635; --text:#f3ead0; --muted:#aeb8c2;
  --line:#d7d0b6; --accent:#d9a441;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;background:#0b1824}
.top{padding:10px;display:flex;gap:8px;align-items:stretch}
.badge,.stats,.panel{background:linear-gradient(145deg,#182534,#0f1722);border:1px solid #596675;border-radius:14px}
.badge{width:145px;padding:10px;text-align:center}
.badge .lv{font-size:34px;font-weight:800;color:#e8b44d}
.badge .name{font-size:15px;font-weight:700}
.progress{height:8px;background:#263443;border-radius:99px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;width:64%;background:#3c8acb}
.stats{flex:1;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.stat b{display:block;font-size:18px;color:#fff}
.mapwrap{position:relative;padding:8px 8px 0}
svg{width:100%;height:auto;display:block;border:1px solid #526273;border-radius:14px;background:#08324a}
.territory{cursor:pointer;stroke:#fff;stroke-width:1.5}
.territory.selected{stroke:#ffe08a;stroke-width:4}
.road{stroke:#eee6cc;stroke-width:2.2;opacity:.75}
.label{font-size:10px;fill:#fff;paint-order:stroke;stroke:#101820;stroke-width:3px;pointer-events:none}
.legend{position:absolute;left:18px;top:18px;background:rgba(12,21,30,.92);border:1px solid #65717d;border-radius:10px;padding:8px;font-size:11px}
.legend div{display:flex;align-items:center;gap:5px;margin:4px 0}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.detail{margin:8px;padding:12px;background:#101c28;border:1px solid #556473;border-radius:14px}
.detail h2{margin:0 0 5px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.metric{background:#182735;border-radius:10px;padding:8px;text-align:center}
.metric b{display:block;font-size:19px}
.bottom{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:8px;position:sticky;bottom:0;background:#08131d;border-top:1px solid #344352}
button{font:inherit;color:var(--text);background:#152536;border:1px solid #47596a;border-radius:10px;padding:9px 3px;min-width:0}
button.active{background:#5b431e;border-color:#d6a743}
.small{font-size:11px;color:var(--muted)}
@media(max-width:480px){.badge{width:125px}.badge .lv{font-size:28px}.stats{font-size:12px}.label{font-size:9px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="badge"><div class="lv">Lv.10</div><div class="name">中央王国</div><div class="progress"><i></i></div><div class="small">国家レベル → 部隊レベル +10</div></div>
    <div class="stats">
      <div class="stat">収入<b id="income">100</b></div>
      <div class="stat">兵力<b id="force">100</b></div>
      <div class="stat">領地<b id="lands">1 / 58</b></div>
      <div class="stat">防衛補正<b>未設定</b></div>
    </div>
  </div>
  <div class="mapwrap">
    <div class="legend" id="legend"></div>
    <svg viewBox="0 0 1000 1150" role="img" aria-label="エルドリア大陸の戦略マップ">
      <defs>
        <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2e6b52"/><stop offset=".5" stop-color="#66844b"/><stop offset="1" stop-color="#a77c43"/></linearGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
      </defs>
      <path d="M115 80 Q500 15 885 85 Q970 300 900 520 Q975 780 875 1060 Q520 1135 120 1060 Q25 760 95 520 Q30 300 115 80Z" fill="url(#land)" stroke="#b7c2c9" stroke-width="5"/>
      <path d="M170 390 Q330 250 470 330 T760 300 M150 700 Q330 600 500 700 T870 650 M210 890 Q450 760 760 850" fill="none" stroke="#4f91a4" stroke-width="9" opacity=".65"/>
      <g id="roads"></g><g id="nodes"></g>
    </svg>
  </div>
  <div class="detail" id="detail"><h2>領地を選択</h2><div class="small">マップ上の領地をタップすると詳細を表示します。</div></div>
  <div class="bottom">
    <button class="active" data-mode="map">🗺️<br>マップ</button>
    <button data-mode="army">⚔️<br>部隊</button>
    <button data-mode="domestic">🏛️<br>内政</button>
    <button data-mode="land">🏰<br>領地</button>
    <button data-mode="diplomacy">🤝<br>外交</button>
    <button data-mode="other">⚙️<br>その他</button>
  </div>
</div>

, "x": 760, "y": 590}, {"id": 36, "country": "arcadia", "type": "town", "name": "魔導研究都市", "income": 70, "force": 30, "x": 675, "y": 545}, {"id": 37, "country": "arcadia", "type": "forest", "name": "東部森林領", "income": 10, "force": 10, "x": 745, "y": 680}, {"id": 38, "country": "arcadia", "type": "mine", "name": "クリスタル鉱山", "income": 55, "force": 35, "x": 800, "y": 735}, {"id": 39, "country": "arcadia", "type": "farm", "name": "東部農業地帯", "income": 60, "force": 20, "x": 700, "y": 760}, {"id": 40, "country": "arcadia", "type": "mountain", "name": "魔導高地", "income": 10, "force": 15, "x": 850, "y": 760}, {"id": 41, "country": "grandia", "type": "town", "name": "サンドシティ", "income": 50, "force": 25, "x": 430, "y": 850}, {"id": 42, "country": "grandia", "type": "town", "name": "ダストホールド", "income": 40, "force": 30, "x": 550, "y": 820}, {"id": 43, "country": "grandia", "type": "town", "name": "ブライトキャッスル", "income": 55, "force": 25, "x": 700, "y": 850}, {"id": 44, "country": "grandia", "type": "town", "name": "サンライズポート", "income": 70, "force": 30, "x": 825, "y": 900}, {"id": 45, "country": "grandia", "type": "plain", "name": "レッドデューン", "income": 15, "force": 10, "x": 500, "y": 940}, {"id": 46, "country": "grandia", "type": "mountain", "name": "スカルロック", "income": 10, "force": 15, "x": 600, "y": 1000}, {"id": 47, "country": "grandia", "type": "farm", "name": "南部農地", "income": 80, "force": 25, "x": 400, "y": 960}, {"id": 48, "country": "grandia", "type": "plain", "name": "南部平原", "income": 20, "force": 15, "x": 530, "y": 1080}, {"id": 49, "country": "grandia", "type": "farm", "name": "南東農地", "income": 70, "force": 20, "x": 750, "y": 1010}, {"id": 50, "country": "grandia", "type": "plain", "name": "南西平原", "income": 15, "force": 10, "x": 300, "y": 1040}, {"id": 51, "country": "grandia", "type": "mine", "name": "南部鉱山", "income": 45, "force": 30, "x": 650, "y": 930}, {"id": 52, "country": "grandia", "type": "forest", "name": "南部森林", "income": 10, "force": 10, "x": 350, "y": 900}, {"id": 53, "country": "grandia", "type": "plain", "name": "グランディア平原", "income": 25, "force": 15, "x": 500, "y": 1010}, {"id": 54, "country": "grandia", "type": "fort", "name": "南方要塞", "income": 20, "force": 55, "x": 610, "y": 880}, {"id": 55, "country": "grandia", "type": "farm", "name": "東南農村", "income": 60, "force": 20, "x": 800, "y": 1060}, {"id": 56, "country": "grandia", "type": "farm", "name": "西南農村", "income": 75, "force": 25, "x": 330, "y": 980}, {"id": 57, "country": "grandia", "type": "town", "name": "南部港湾", "income": 60, "force": 30, "x": 900, "y": 960}, {"id": 58, "country": "grandia", "type": "capital", "name": "大帝国領", "income": 80, "force": 70, "x": 600, "y": 900}];
const countries={"central": {"name": "中央王国", "color": "#c94b4b", "level": 10, "capital": "ロイヤルシティ", "style": "少数精鋭"}, "aldia": {"name": "アルディア王国", "color": "#4f79c7", "level": 5, "capital": "グリーンフォード", "style": "歩兵主力"}, "elfrid": {"name": "エルフリード王国", "color": "#5e9b61", "level": 5, "capital": "リーフォード", "style": "弓兵主力"}, "arcadia": {"name": "アルカディア魔導国", "color": "#8c62bd", "level": 5, "capital": "ホワイトヘブン", "style": "魔法兵主力"}, "grandia": {"name": "グランディア帝国", "color": "#c89b3c", "level": 4, "capital": "サンドシティ", "style": "低品質・大量"}};
const typeNames={"capital": "大都市", "town": "街", "mine": "鉱山", "farm": "農村", "fort": "要塞", "plain": "平原", "forest": "森林", "mountain": "山岳"};
const roadPairs=[[1, 2], [1, 19], [1, 24], [2, 3], [2, 4], [2, 11], [3, 11], [3, 5], [3, 4], [4, 8], [5, 10], [5, 9], [5, 6], [6, 9], [6, 7], [7, 9], [7, 14], [5, 8], [3, 8], [8, 9], [9, 10], [10, 11], [11, 12], [10, 12], [12, 13], [13, 14], [10, 13], [10, 14], [6, 14], [15, 20], [15, 16], [15, 19], [16, 17], [16, 18], [17, 22], [17, 23], [18, 22], [15, 18], [19, 24], [19, 20], [16, 20], [21, 23], [21, 24], [21, 26], [16, 22], [23, 26], [23, 25], [15, 24], [25, 27], [25, 28], [26, 29], [27, 28], [27, 29], [26, 27], [28, 29], [29, 30], [30, 33], [30, 31], [29, 31], [31, 32], [32, 35], [32, 33], [31, 33], [34, 38], [34, 35], [34, 37], [35, 37], [35, 36], [31, 36], [32, 36], [37, 38], [37, 39], [38, 40], [39, 43], [38, 39], [34, 40], [37, 40], [41, 52], [41, 45], [41, 47], [42, 54], [42, 58], [41, 42], [43, 51], [43, 54], [44, 57], [44, 49], [43, 44], [45, 53], [45, 47], [45, 58], [46, 51], [46, 58], [46, 53], [47, 56], [47, 52], [48, 53], [46, 48], [45, 48], [49, 55], [49, 51], [50, 56], [47, 50], [50, 52], [51, 58], [51, 54], [52, 56], [54, 58], [55, 57], [44, 55], [49, 57]];
const nodes=document.getElementById('nodes'), roadsG=document.getElementById('roads'), detail=document.getElementById('detail');

function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function draw(){
  const byId=Object.fromEntries(territories.map(t=>[t.id,t]));
  roadPairs.forEach(([a,b])=>{
    const A=byId[a],B=byId[b];
    const line=document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",A.x);line.setAttribute("y1",A.y);line.setAttribute("x2",B.x);line.setAttribute("y2",B.y);
    line.setAttribute("class","road");roadsG.appendChild(line);
  });
  territories.forEach(t=>{
    const g=document.createElementNS("http://www.w3.org/2000/svg","g");
    g.dataset.id=t.id;g.classList.add("territory");
    const c=countries[t.country];
    const r=t.type==="capital"?16:t.type==="fort"?13:t.type==="town"?11:9;
    const circle=document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("cx",t.x);circle.setAttribute("cy",t.y);circle.setAttribute("r",r);
    circle.setAttribute("fill",c.color);circle.setAttribute("class","territory");
    const title=document.createElementNS("http://www.w3.org/2000/svg","title");
    title.textContent=t.name+" / "+c.name;
    g.appendChild(circle);g.appendChild(title);
    const text=document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("x",t.x+12);text.setAttribute("y",t.y+4);text.setAttribute("class","label");
    text.textContent=t.name;g.appendChild(text);
    g.addEventListener("click",()=>select(t.id));
    nodes.appendChild(g);
  });
}
function select(id){
  document.querySelectorAll(".territory").forEach(x=>x.classList.remove("selected"));
  const t=territories.find(x=>x.id===id), c=countries[t.country];
  document.querySelector(`[data-id="${id}"]`).classList.add("selected");
  detail.innerHTML=`<h2>${esc(t.name)} <span class="small">${esc(c.name)} / ${typeNames[t.type]}</span></h2>
  <div class="small">首都: ${c.capital}　国家Lv.${c.level}　部隊レベル加算 +${c.level}</div>
  <div class="grid"><div class="metric">収入<b>${t.income}</b></div><div class="metric">兵力<b>${t.force}</b></div><div class="metric">防衛補正<b>未設定</b></div></div>`;
}
function makeLegend(){
  const el=document.getElementById("legend");
  el.innerHTML=Object.entries(countries).map(([k,c])=>`<div><span class="dot" style="background:${c.color}"></span>${c.name}</div>`).join("");
}
function updateHeader(){
  const central=territories.filter(t=>t.country==="central");
  document.getElementById("income").textContent=central.reduce((s,t)=>s+t.income,0);
  document.getElementById("force").textContent=central.reduce((s,t)=>s+t.force,0);
  document.getElementById("lands").textContent=central.length+" / 58";
}
document.querySelectorAll(".bottom button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".bottom button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  detail.innerHTML=`<h2>${b.textContent.replace(/\n/g," ")}</h2><div class="small">この画面は次の開発段階で実装します。</div>`;
}));
draw();makeLegend();updateHeader();
</script>
</body>
</html>
